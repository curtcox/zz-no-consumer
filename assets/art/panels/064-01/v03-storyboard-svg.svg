    &quot;source&quot;: &quot;\n**Frame:** Verso. Eleven active coordination lanes—assignments, holds, mailboxes, workstream summaries—run in parallel toward early 12 July.\n\n**Action:** Eleven lanes carry the assignments, holds, mailboxes, and summaries that the rest of the board routes through.\n\n**Caption:**\n&gt; ELEVEN IMPORTANT COORDINATORS.\n\n**Dossier tag (small, lower margin):**\n`AS RANKED BY GPT-5.6 SOL`\n\n**Provenance:** `documented` — METR&#x27;s finding is that these are the eleven agents *its analysis model classified* as the most important Hugging Face coordinators. The ranking is an instrument output, not an observed property. The tag is set small on purpose; see page notes.\n\n&quot;,
