<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel chooser</title>
<link rel="stylesheet" href="/app.css">
<body>
<header>
  <div class="where">
    <h1 id="panel">…</h1>
    <p id="title"></p>
  </div>
  <nav>
    <button id="prior" type="button" accesskey="j">← Prior</button>
    <button id="next" type="button" accesskey="k">Next →</button>
  </nav>
  <p class="progress"><span id="position"></span><span id="decided"></span></p>
</header>
<p id="message" role="status" hidden></p>
<main>
  <section id="choices" aria-label="Generated images for this panel"></section>
  <details id="script-box">
    <summary>Panel script</summary>
    <pre id="script"></pre>
  </details>
  <section aria-labelledby="reference-heading">
    <h2 id="reference-heading">Layout reference</h2>
    <p class="aside">Rendered on demand from the script and the storyboard. Stand-ins for
      composition, not artwork — they cannot be chosen.</p>
    <div id="reference" class="grid"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
