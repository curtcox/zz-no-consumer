name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate continuity files
        run: python scripts/validate-continuity.py

      - name: Validate production foundations
        run: python scripts/validate-production-foundations.py

      - name: Check page, source, and provenance cross references
        run: python scripts/crossref.py check --strict

      - name: Check the novella against the page scripts
        run: python scripts/novella.py check --strict

      - name: Check 256t pointers against the standard's test vectors
        run: python scripts/t256.py check

      - name: Check the appendix of contested assertions, fallacies, and professional objections
        run: python scripts/appendix.py check

      - name: Check that every story-page reference in the sources is a link
        run: python scripts/pagelinks.py check

      - name: Check controlled knowledge-map assets
        run: python scripts/knowledge_maps.py check

      - name: Check fog-of-war knowledge-map studies
        run: python scripts/knowledge_maps_fog.py check

      - name: Check local knowledge-map images
        run: python scripts/knowledge_map_local.py check

      - name: Test offline knowledge-map generation boundaries
        run: python -m unittest discover -s scripts -p test_knowledge_map_local.py

      - name: Check structure-preserving knowledge-map finish images
        run: python scripts/knowledge_map_finish.py check

      - name: Test offline knowledge-map finish boundaries
        run: python -m unittest discover -s scripts -p test_knowledge_map_finish.py

      - name: Check deterministic storyboard assets
        run: python scripts/storyboards.py check --complete

      - name: Check panel image generation summary
        run: python scripts/image_generation_status.py check

      - name: Check offline artwork queue and recovery boundaries
        run: python scripts/art_jobs.py check

      - name: Check offline image cropping and source preservation
        run: python scripts/image_crop.py check

      - name: Check rasterisation and the ant QR codec
        run: |
          python scripts/rasterize.py check
          python scripts/qr_core.py check
          python scripts/antpose.py check
          python scripts/qrant.py check
          python scripts/qr_gallery.py check

      - name: Check effective reader lettering
        run: python scripts/letterpress.py audit

      - name: Check page and panel structure
        run: |
          python scripts/pagination.py check
          python scripts/panels.py check

      - name: Check panel geometry and selected artwork fit
        run: python scripts/panel_layout.py check

      - name: Build site
        run: python scripts/build-site.py

      - name: Validate built storyboard workshop
        run: python scripts/storyboards.py check --complete --built

      - name: Validate published panel fit
        run: python scripts/panel_layout.py check --built

      - name: Test local viewer version compatibility
        run: python scripts/local_viewer.py check

      - name: Test rendered panel visibility in Chrome
        run: |
          python scripts/panel_browser_checks.py write --out /tmp/panel-check.html
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom file:///tmp/panel-check.html > /tmp/panel-check-result.html
          python scripts/panel_browser_checks.py verify --out /tmp/panel-check-result.html

      - name: Validate viewer routes
        run: python scripts/validate-viewer.py

      - name: Validate novella reader, page anchors, and downloads
        run: python scripts/validate-novella.py

      - name: Validate all local site and EPUB link destinations
        run: python scripts/validate-site-links.py

      - name: Validate knowledge-map gallery
        run: python scripts/validate-knowledge-map-gallery.py

      - name: Validate the published ant QR gallery
        run: python scripts/qr_gallery.py check --built

      - name: Check that every story-page reference in the build is a link
        run: python scripts/pagelinks.py check --built

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
