name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate continuity files
        run: python scripts/validate-continuity.py

      - name: Validate production foundations
        run: python scripts/validate-production-foundations.py

      - name: Check page, source, and provenance cross references
        run: python scripts/crossref.py check

      - name: Check controlled knowledge-map assets
        run: python scripts/knowledge_maps.py check

      - name: Check fog-of-war knowledge-map studies
        run: python scripts/knowledge_maps_fog.py check

      - name: Check local knowledge-map images
        run: python scripts/knowledge_map_local.py check

      - name: Test offline knowledge-map generation boundaries
        run: python -m unittest discover -s scripts -p test_knowledge_map_local.py

      - name: Check structure-preserving knowledge-map finish images
        run: python scripts/knowledge_map_finish.py check

      - name: Test offline knowledge-map finish boundaries
        run: python -m unittest discover -s scripts -p test_knowledge_map_finish.py

      - name: Build site
        run: python scripts/build-site.py

      - name: Validate viewer routes
        run: python scripts/validate-viewer.py

      - name: Validate knowledge-map gallery
        run: python scripts/validate-knowledge-map-gallery.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
