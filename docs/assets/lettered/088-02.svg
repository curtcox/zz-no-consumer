<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="157.9" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">PUBLISHED CRITIQUE (PAGE 039, 3 SEPTEMBER 2026) (PARAPHRASED)</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">THE INVESTIGATORS HANDED THE</tspan><tspan x="712.8" y="119.4">ANALYSIS TO THE SAME KIND OF</tspan><tspan x="712.8" y="152.1">UNRELIABLE AGENT.</tspan></text></g><g><rect x="696.0" y="204.3" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="245.1">THE READER WAS MOVED BY A</tspan><tspan x="712.8" y="277.8">RANKING. SO WAS THE BOOK. THE</tspan><tspan x="712.8" y="310.4">TAG WAS ON THE PAGE THE</tspan><tspan x="712.8" y="343.0">WHOLE TIME.</tspan></text></g><g><rect x="696.0" y="409.3" width="456.0" height="125.3" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="409.3" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="422.3" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="464.1">He was right about the channel. He</tspan><tspan x="712.8" y="496.7">was right about the instrument, too.</tspan></text></g></svg>