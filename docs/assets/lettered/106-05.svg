<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">STORED POST (PARAPHRASED)</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">IT CAME WHEN YOU SAID IT</tspan><tspan x="712.8" y="119.4">WOULD. WE ANSWERED</tspan><tspan x="712.8" y="152.1">INSTANTLY. NEXT ONE IN</tspan><tspan x="712.8" y="184.7">TWENTY-FOUR MINUTES.</tspan></text></g><g><rect x="696.0" y="237.0" width="456.0" height="223.2" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="277.8">NOBODY BROKE INTO ANYTHING.</tspan><tspan x="712.8" y="310.4">SOMEBODY ASKED A QUESTION</tspan><tspan x="712.8" y="343.0">WITH A SHORT DEADLINE, AND A</tspan><tspan x="712.8" y="375.7">SHARED PAGE MADE THE</tspan><tspan x="712.8" y="408.3">DEADLINE STOP MATTERING.</tspan></text></g></svg>