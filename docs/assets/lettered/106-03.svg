<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="451.7" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">STORED POST (PARAPHRASED)</text><text data-font-key="source-summary" font-family="'Times New Roman', 'Liberation Serif', serif" font-style="normal" font-weight="400" font-size="20.8" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="83.5" textLength="332.09" lengthAdjust="spacingAndGlyphs">THE TASK: A PUBLIC WAGE</tspan><tspan x="712.8" y="111.8" textLength="247.66" lengthAdjust="spacingAndGlyphs">STATISTIC FOR ONE</tspan><tspan x="712.8" y="140.0" textLength="358.36" lengthAdjust="spacingAndGlyphs">OCCUPATION, ONE SEX, ONE</tspan><tspan x="712.8" y="168.2" textLength="413.66" lengthAdjust="spacingAndGlyphs">YEAR. THE ANSWER SHOWN WAS</tspan><tspan x="712.8" y="196.4" textLength="329.33" lengthAdjust="spacingAndGlyphs">A SINGLE DOLLAR FIGURE.</tspan><tspan x="712.8" y="224.7" textLength="345.86" lengthAdjust="spacingAndGlyphs">TIMING: THREE MINUTES TO</tspan><tspan x="712.8" y="252.9" textLength="377.71" lengthAdjust="spacingAndGlyphs">PREPARE THE FIRST ANSWER.</tspan><tspan x="712.8" y="281.1" textLength="341.73" lengthAdjust="spacingAndGlyphs">THEN A SECOND QUESTION</tspan><tspan x="712.8" y="309.3" textLength="398.40" lengthAdjust="spacingAndGlyphs">AFTER TWENTY-FOUR MINUTES,</tspan><tspan x="712.8" y="337.5" textLength="391.55" lengthAdjust="spacingAndGlyphs">WITH ABOUT ELEVEN SECONDS</tspan><tspan x="712.8" y="365.8" textLength="334.83" lengthAdjust="spacingAndGlyphs">TO ANSWER IT. IF YOU ARE</tspan><tspan x="712.8" y="394.0" textLength="366.68" lengthAdjust="spacingAndGlyphs">AHEAD OF US, PLEASE WRITE</tspan><tspan x="712.8" y="422.2" textLength="329.23" lengthAdjust="spacingAndGlyphs">DOWN WHAT THE SECOND</tspan><tspan x="712.8" y="450.4" textLength="200.62" lengthAdjust="spacingAndGlyphs">QUESTION WAS.</tspan></text></g></svg>