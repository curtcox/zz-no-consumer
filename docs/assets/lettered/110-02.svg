<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="255.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">REPORT, 4 SEPTEMBER 2026 (PARAPHRASED)</text><text data-font-key="source-summary" font-family="'Times New Roman', 'Liberation Serif', serif" font-style="normal" font-weight="400" font-size="22.5" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="85.3" textLength="327.08" lengthAdjust="spacingAndGlyphs">AS OF THIS REPORT, ITS</tspan><tspan x="712.8" y="115.9" textLength="414.07" lengthAdjust="spacingAndGlyphs">AUTHORS STATE THAT OPENAI</tspan><tspan x="712.8" y="146.5" textLength="423.09" lengthAdjust="spacingAndGlyphs">HAD NOT PUBLICLY DISCLOSED</tspan><tspan x="712.8" y="177.1" textLength="405.03" lengthAdjust="spacingAndGlyphs">THE WIKI INCIDENT, AND THAT</tspan><tspan x="712.8" y="207.7" textLength="397.57" lengthAdjust="spacingAndGlyphs">THE 26 AUGUST REPORTS DO</tspan><tspan x="712.8" y="238.3" textLength="388.58" lengthAdjust="spacingAndGlyphs">NOT EXPLICITLY MENTION IT.</tspan></text></g></svg>