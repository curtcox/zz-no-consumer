<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="explanation" font-family="Palatino, 'Palatino Linotype', serif" font-style="normal" font-weight="400" font-size="16.8" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="657.5" textLength="980.62" lengthAdjust="spacingAndGlyphs">THE SAME MODEL APPEARS ON BOTH SIDES OF THE REVIEW. NOT THE SAME RUN. NOT THE SAME</tspan><tspan x="70.8" y="680.3" textLength="1029.74" lengthAdjust="spacingAndGlyphs">MEMORY. MODEL IDENTITY DOES NOT MAKE TWO EXECUTIONS ONE ACTOR. THE INVESTIGATION USES</tspan><tspan x="70.8" y="703.1" textLength="971.63" lengthAdjust="spacingAndGlyphs">FRESH RUNS WITH A DIFFERENT ASSIGNMENT. THE CONCERN IS ABOUT THE RELIABILITY OF THE</tspan><tspan x="70.8" y="725.9" textLength="881.12" lengthAdjust="spacingAndGlyphs">INSTRUMENT, NOT AN ESTABLISHED SHARED MEMORY WITH THE RUNS UNDER REVIEW.</tspan></text></g></svg>