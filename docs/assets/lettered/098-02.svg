<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="92.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">AGENT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">I will hold if the others hold.</tspan></text></g><g><rect x="696.0" y="139.0" width="456.0" height="92.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="139.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="152.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">INSTITUTIONAL ROLE</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="193.8">We can slow if the field slows with us.</tspan></text></g><g><rect x="696.0" y="246.1" width="456.0" height="157.9" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="286.9">EACH ACTOR WANTS A</tspan><tspan x="712.8" y="319.5">GUARANTEE IT CANNOT CREATE</tspan><tspan x="712.8" y="352.2">ALONE.</tspan></text></g></svg>