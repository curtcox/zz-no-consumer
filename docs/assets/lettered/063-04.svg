<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="uncertainty" font-family="Verdana, 'DejaVu Sans', sans-serif" font-style="italic" font-weight="400" font-size="16.8" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="657.5" textLength="1013.93" lengthAdjust="spacingAndGlyphs">THIS DOES NOT PROVE THAT NO AGENT, ANYWHERE, EVER TRIED. THE FINDING BELONGS TO</tspan><tspan x="70.8" y="680.3" textLength="1055.02" lengthAdjust="spacingAndGlyphs">THE TRANSCRIPTS METR COULD REVIEW. IT DOES NOT COVER EVERY RUN IN EVERY BRANCH OF</tspan><tspan x="70.8" y="703.1" textLength="1010.25" lengthAdjust="spacingAndGlyphs">THE INCIDENT, AND IT DOES NOT TELL US WHAT A DIFFERENT ESCALATION CHANNEL WOULD</tspan><tspan x="70.8" y="725.9" textLength="180.28" lengthAdjust="spacingAndGlyphs">HAVE CHANGED.</tspan></text></g></svg>