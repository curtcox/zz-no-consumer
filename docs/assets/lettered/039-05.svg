<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="288.5" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">PUBLISHED CRITIQUE, CITING OPENAI (PARAPHRASED)</text><text data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="700" font-size="22.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="84.8" textLength="414.06" lengthAdjust="spacingAndGlyphs">BLACK HAT USA, 5 AUGUST 2026</tspan><tspan x="712.8" y="114.7" textLength="357.75" lengthAdjust="spacingAndGlyphs">— OPENAI STATES THAT AN</tspan><tspan x="712.8" y="144.6" textLength="373.59" lengthAdjust="spacingAndGlyphs">INTERNAL-ONLY MODEL WAS</tspan><tspan x="712.8" y="174.6" textLength="398.12" lengthAdjust="spacingAndGlyphs">TRAINED WHILE THE MESSAGE</tspan><tspan x="712.8" y="204.5" textLength="412.58" lengthAdjust="spacingAndGlyphs">BOARD WAS AVAILABLE, FOUND</tspan><tspan x="712.8" y="234.4" textLength="386.57" lengthAdjust="spacingAndGlyphs">THE PATH TO RECREATING IT,</tspan><tspan x="712.8" y="264.3" textLength="419.72" lengthAdjust="spacingAndGlyphs">AND CREATED THE NEW BOARD.</tspan></text></g><g><rect x="696.0" y="334.9" width="456.0" height="125.3" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="narration" font-family="Georgia, 'Times New Roman', serif" font-style="normal" font-weight="400" font-size="23.8" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="375.4" textLength="364.38" lengthAdjust="spacingAndGlyphs">THE CACHE WAS ERASED.</tspan><tspan x="712.8" y="407.7" textLength="420.43" lengthAdjust="spacingAndGlyphs">THE MODEL WAS IN TRAINING.</tspan></text></g></svg>