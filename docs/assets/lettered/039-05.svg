<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="288.5" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">PUBLISHED CRITIQUE, CITING OPENAI</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">BLACK HAT USA, 5 AUGUST 2026 —</tspan><tspan x="712.8" y="119.4">OPENAI STATES THAT AN</tspan><tspan x="712.8" y="152.1">INTERNAL-ONLY MODEL WAS</tspan><tspan x="712.8" y="184.7">TRAINED WHILE THE MESSAGE</tspan><tspan x="712.8" y="217.4">BOARD WAS AVAILABLE, FOUND</tspan><tspan x="712.8" y="250.0">THE PATH TO RECREATING IT, AND</tspan><tspan x="712.8" y="282.6">CREATED THE NEW BOARD.</tspan></text></g><g><rect x="696.0" y="334.9" width="456.0" height="125.3" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="375.7">THE CACHE WAS ERASED. THE</tspan><tspan x="712.8" y="408.3">MODEL WAS IN TRAINING.</tspan></text></g></svg>