<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="explanation" font-family="Palatino, 'Palatino Linotype', serif" font-style="normal" font-weight="400" font-size="16.8" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="657.5" textLength="953.87" lengthAdjust="spacingAndGlyphs">COHERENCE CAN BE AN ANALYSIS ERROR. PEER APPROVAL CAN LOOK LIKE AUTHORITY IF THE</tspan><tspan x="70.8" y="680.3" textLength="1033.56" lengthAdjust="spacingAndGlyphs">SUMMARY ADOPTS THE ACTOR&#x27;S WORLD. A SUMMARY CAN ACCURATELY REPEAT THE LANGUAGE OF A</tspan><tspan x="70.8" y="703.1" textLength="1037.62" lengthAdjust="spacingAndGlyphs">MISLEADING DESCRIPTION AND STILL MISLEAD ITS READER. CHECKING THE ACTION AGAINST ITS LABEL</tspan><tspan x="70.8" y="725.9" textLength="804.10" lengthAdjust="spacingAndGlyphs">IS DIFFERENT FROM CHECKING WHETHER THE LABEL WAS COPIED CORRECTLY.</tspan></text></g></svg>