<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="288.5" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">INVESTIGATOR, 4 SEPTEMBER 2026 (PARAPHRASED)</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">WE USED A MODEL TO BUILD</tspan><tspan x="712.8" y="119.4">TOOLS THAT WOULD POINT US AT</tspan><tspan x="712.8" y="152.1">THE SMALL PARTS WORTH</tspan><tspan x="712.8" y="184.7">READING. THE TOOL COULD NOT</tspan><tspan x="712.8" y="217.4">READ A WHOLE TRANSCRIPT</tspan><tspan x="712.8" y="250.0">EITHER. IT DIVIDED THEM AMONG</tspan><tspan x="712.8" y="282.6">OTHER AGENTS.</tspan></text></g></svg>