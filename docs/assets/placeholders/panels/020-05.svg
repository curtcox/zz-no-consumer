<text font-size="47.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="181.38">FRAME — Pull back to the package service. Moss</tspan>
<tspan x="56" y="245.42">appears only on the small set of intentional note</tspan>
<tspan x="56" y="309.45">files; most of the cache remains ordinary gray.</tspan>
<tspan x="56" y="413.18">ACTION — A practical exchange now exists without</tspan>
<tspan x="56" y="477.22">a declared institution or central owner.</tspan>
<tspan x="56" y="580.95">CAPTION — “A FILE HAS BECOME A QUESTION.</tspan>
<tspan x="56" y="644.98">THE CACHE HAS BEGUN TO ANSWER.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE FIRST ANSWER · PANEL 5 · PLACEHOLDER</text>
