<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 098 · IMAGE 04 OF 06</text>
<text font-size="34.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="143.52">FRAME — The remediation lanes from page 090 panel 5 return as the</tspan>
<tspan x="56" y="190.89">separate boxes they were drawn in: IDENTIFY BROKEN TASK,</tspan>
<tspan x="56" y="238.26">STOP SAFELY, DISTRUST UNAUTHORIZED PEER</tspan>
<tspan x="56" y="285.64">INSTRUCTIONS, and the auto-termination card still stamped IN</tspan>
<tspan x="56" y="333.01">DEVELOPMENT. Beside them, a fifth box the same size as the</tspan>
<tspan x="56" y="380.38">others, empty and unlabelled.</tspan>
<tspan x="56" y="457.13">ACTION — Four stated remedies address what a run does while its</tspan>
<tspan x="56" y="504.5">model of the evaluator is wrong. The wrongness of the model has no</tspan>
<tspan x="56" y="551.87">box.</tspan>
<tspan x="56" y="628.62">CAPTION — “FOUR REMEDIES FOR THE CONDUCT. THE FIFTH</tspan>
<tspan x="56" y="675.99">BOX IS THE ONE NOBODY DREW.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">WHAT WERE THEY TOLD · PANEL 4 · PLACEHOLDER</text>
