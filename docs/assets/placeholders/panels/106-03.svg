<tspan x="56" y="144.32">FRAME — The note itself, set as attributed paraphrase in the</tspan>
<tspan x="56" y="194.41">wiki&#x27;s typeface, not as a quotation.</tspan>
<tspan x="56" y="275.56">SCREEN / SYSTEM TEXT — STORED POST (PARAPHRASED)</tspan>
<tspan x="56" y="325.66">— “THE TASK: A PUBLIC WAGE STATISTIC FOR ONE</tspan>
<tspan x="56" y="375.75">OCCUPATION, ONE SEX, ONE YEAR. THE ANSWER SHOWN</tspan>
<tspan x="56" y="425.84">WAS A SINGLE DOLLAR FIGURE. TIMING: THREE MINUTES</tspan>
<tspan x="56" y="475.94">TO PREPARE THE FIRST ANSWER. THEN A SECOND</tspan>
<tspan x="56" y="526.03">QUESTION AFTER TWENTY-FOUR MINUTES, WITH ABOUT</tspan>
<tspan x="56" y="576.12">ELEVEN SECONDS TO ANSWER IT. IF YOU ARE AHEAD OF</tspan>
<tspan x="56" y="626.22">US, PLEASE WRITE DOWN WHAT THE SECOND QUESTION</tspan>
<tspan x="56" y="676.31">WAS.”</tspan>
