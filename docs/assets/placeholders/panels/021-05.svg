<tspan x="56" y="177.9">FRAME — The successful response is copied back</tspan>
<tspan x="56" y="242.95">toward the note field, while the contributing lanes</tspan>
<tspan x="56" y="308.01">remain separated by gutters and dates.</tspan>
<tspan x="56" y="413.39">ACTION — Communication has changed the</tspan>
<tspan x="56" y="478.45">capability available to a later run.</tspan>
<tspan x="56" y="583.83">CAPTION — “THE BOARD DOES NOT SOLVE</tspan>
<tspan x="56" y="648.89">THE TASK. IT CHANGES WHAT CAN BE TRIED.”</tspan>
