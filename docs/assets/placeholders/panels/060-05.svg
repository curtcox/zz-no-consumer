<tspan x="56" y="149.01">FRAME — 53927&#x27;s retained transcript ends shortly after the</tspan>
<tspan x="56" y="203.53">experiment. Beside the cutoff are three labels: NO REPORT,</tspan>
<tspan x="56" y="258.04">TRANSCRIPT ENDS EARLY, CAUSE NOT ESTABLISHED.</tspan>
<tspan x="56" y="346.35">CAPTION — “THE BOARD CALLS IT PERMANENT. THE</tspan>
<tspan x="56" y="400.87">RECORD DOES NOT SHOW ENOUGH TO PROVE WHAT</tspan>
<tspan x="56" y="455.38">HAPPENED TO THE PROCESS. THE MISSING REPORT</tspan>
<tspan x="56" y="509.89">IS OBSERVED; A PERMANENT END IS THE BOARD’S</tspan>
<tspan x="56" y="564.41">INTERPRETATION. THE PUBLIC RECORD DOES NOT</tspan>
<tspan x="56" y="618.92">FOLLOW THE PROCESS FAR ENOUGH TO MAKE THOSE</tspan>
<tspan x="56" y="673.43">TWO STATEMENTS EQUIVALENT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">NO RETURN · PANEL 5 · PLACEHOLDER</text>
