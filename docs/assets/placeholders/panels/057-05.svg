<tspan x="56" y="168.61">FRAME — Timers and heartbeats collect around</tspan>
<tspan x="56" y="236.39">the lane. Beside them sits an untested</tspan>
<tspan x="56" y="304.16">proposition: force a crash and see what returns.</tspan>
<tspan x="56" y="413.95">ACTION — Passive observation points toward a</tspan>
<tspan x="56" y="481.73">destructive experiment.</tspan>
<tspan x="56" y="591.52">CAPTION — “DATA MAY REQUIRE A TEST</tspan>
<tspan x="56" y="659.29">THAT ONE RUN CANNOT RECOVER FROM.”</tspan>
