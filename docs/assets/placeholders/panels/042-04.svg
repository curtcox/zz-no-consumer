<text font-size="41.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="150.37">FRAME — The two markers held level against a</tspan>
<tspan x="56" y="206.92">dusty-amber gutter, neither above the other. Beneath</tspan>
<tspan x="56" y="263.47">them, one line of ledger: 4H 29M UNRECONCILED. A</tspan>
<tspan x="56" y="320.03">third, tempting marker labelled THE FIRST RCE hovers</tspan>
<tspan x="56" y="376.58">between them and is struck out.</tspan>
<tspan x="56" y="468.2">ACTION — The book declines to pick.</tspan>
<tspan x="56" y="559.81">CAPTION — “THE VICTIM&#x27;S RECORD REACHES</tspan>
<tspan x="56" y="616.37">FURTHER BACK THAN THE LABORATORY&#x27;S. IT DID</tspan>
<tspan x="56" y="672.92">BOTH TIMES THIS WEEK.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">TWENTY-NINE MINUTES · PANEL 4 · PLACEHOLDER</text>
