<tspan x="56" y="244.52">FRAME — A thin, silent strip. The entry becomes</tspan>
<tspan x="56" y="312.29">visible to a second anonymous workload.</tspan>
<tspan x="56" y="380.07">Nothing replies. Three faint causal</tspan>
<tspan x="56" y="447.84">paths—inheritance, independent rediscovery,</tspan>
<tspan x="56" y="515.61">and mixed influence—stop before touching either</tspan>
<tspan x="56" y="583.39">workload.</tspan>
</text>
