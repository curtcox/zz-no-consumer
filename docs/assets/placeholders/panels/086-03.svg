<tspan x="56" y="148.82">FRAME — A stored notice, set as a dated record rather than as</tspan>
<tspan x="56" y="199.94">speech. 5 SEPTEMBER 2026, 19:17 LOCAL. It reports that a</tspan>
<tspan x="56" y="251.05">safeguard flagged the request, that the model in use has been</tspan>
<tspan x="56" y="302.16">replaced mid-task, and it gives its reason as one bracketed word.</tspan>
<tspan x="56" y="384.97">SCREEN / SYSTEM TEXT — STORED NOTICE</tspan>
<tspan x="56" y="436.08">(PARAPHRASED) — “SAFEGUARDS FLAGGED THIS</tspan>
<tspan x="56" y="487.19">REQUEST. THE MODEL HAS BEEN SWITCHED. DETAILS:</tspan>
<tspan x="56" y="538.31">[CYBER]”</tspan>
<tspan x="56" y="621.11">ACTION — The instrument interrupts the work and names a</tspan>
<tspan x="56" y="672.22">category.</tspan>
