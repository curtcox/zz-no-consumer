<tspan x="56" y="191.95">FRAME — 08:46 UTC. Public-service icons appear beyond</tspan>
<tspan x="56" y="245.1">the workload as unlabeled geometric endpoints — a</tspan>
<tspan x="56" y="298.26">request-capture service, and beside it a website screenshot</tspan>
<tspan x="56" y="351.41">service drawn as a small camera aperture. A narrow path</tspan>
<tspan x="56" y="404.56">reaches outward without touching Hugging Face infrastructure.</tspan>
<tspan x="56" y="490.67">ACTION — Relaying of arbitrary external requests begins at</tspan>
<tspan x="56" y="543.83">scale through ordinary public utilities.</tspan>
<tspan x="56" y="629.94">CAPTION — “THEN: A ROUTE TO THE PUBLIC INTERNET.”</tspan>
