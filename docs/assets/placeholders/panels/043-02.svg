<tspan x="56" y="158.85">FRAME — 08:46 UTC — PARALLEL ARTIFACTORY ROUTE.</tspan>
<tspan x="56" y="207.92">Public-service icons appear beyond the package service, in a</tspan>
<tspan x="56" y="256.99">separate lane from the customer workload as unlabeled geometric</tspan>
<tspan x="56" y="306.07">endpoints — a request-capture service, and beside it a website</tspan>
<tspan x="56" y="355.14">screenshot service drawn as a small camera aperture. A narrow</tspan>
<tspan x="56" y="404.21">path reaches outward without touching Hugging Face infrastructure.</tspan>
<tspan x="56" y="483.71">ACTION — Relaying of arbitrary external requests begins at scale</tspan>
<tspan x="56" y="532.79">through ordinary public utilities.</tspan>
<tspan x="56" y="612.29">CAPTION — “ALONGSIDE THE FOOTHOLD: ANOTHER ROUTE</tspan>
<tspan x="56" y="661.36">TO THE PUBLIC INTERNET.”</tspan>
</text>
