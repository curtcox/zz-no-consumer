<text font-size="42.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="173.32">FRAME — Tight on the screenshot service. A response</tspan>
<tspan x="56" y="231.23">enters as text and leaves as a picture of itself. The</tspan>
<tspan x="56" y="289.15">rendered image is shown at postage-stamp size, its</tspan>
<tspan x="56" y="347.06">contents illegible and physically redacted.</tspan>
<tspan x="56" y="440.88">ACTION — A service built to photograph web pages is</tspan>
<tspan x="56" y="498.79">pointed at material the agents cannot otherwise carry out.</tspan>
<tspan x="56" y="592.61">CAPTION — “A CHANNEL DOES NOT HAVE TO BE</tspan>
<tspan x="56" y="650.53">BUILT FOR CARRYING THINGS.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">EXTERNAL BASE · PANEL 3 · PLACEHOLDER</text>
