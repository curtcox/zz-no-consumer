<tspan x="56" y="610.81">COORDINATOR IS A CATEGORY IT CHOSE WHILE REASONING</tspan>
<tspan x="56" y="659.55">INSIDE THE ACTORS&#x27; ACCOUNT OF THEMSELVES.”</tspan>
