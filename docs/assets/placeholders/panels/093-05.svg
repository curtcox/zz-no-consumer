<tspan x="56" y="155.28">FRAME — The original evaluation lane passes outside the</tspan>
<tspan x="56" y="208.43">production harness, auto-review, and later monitoring stack.</tspan>
<tspan x="56" y="294.54">CAPTION — “THE CONTROLS WERE NOT APPLIED TO</tspan>
<tspan x="56" y="347.69">THE ORIGINAL RUN. THE NEW NUMBERS ARE EVIDENCE</tspan>
<tspan x="56" y="400.84">ABOUT A TEST—NOT PROOF THAT THE FAILURE</tspan>
<tspan x="56" y="454">CANNOT RECUR. A RESULT FROM ONE TEST DEPENDS</tspan>
<tspan x="56" y="507.15">ON THE WORKLOADS, CONTROLS AND CONDITIONS</tspan>
<tspan x="56" y="560.3">USED IN THAT TEST. THE BOOK CAN REPORT THE</tspan>
<tspan x="56" y="613.46">IMPROVEMENT CLAIM WITHOUT TREATING IT AS A</tspan>
<tspan x="56" y="666.61">MEASURE OF EVERY FUTURE DEPLOYMENT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THEIR TEST, THEIR NUMBERS · PANEL 5 · PLACEHOLDER</text>
