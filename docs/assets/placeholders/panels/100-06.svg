<tspan x="56" y="174.88">FRAME — The four columns again. DOCUMENTED EVENT</tspan>
<tspan x="56" y="229.73">holds the stack entered on page 099. ORGANIZATION</tspan>
<tspan x="56" y="284.58">CLAIM and INDEPENDENT CHECK are still empty. OPEN</tspan>
<tspan x="56" y="339.44">QUESTION holds panel 3&#x27;s four rows folded to one line, and</tspan>
<tspan x="56" y="394.29">the column is drawn with room for more.</tspan>
<tspan x="56" y="483.15">CAPTION — “THE BOOK HAS A PAGE FOR THE FACT</tspan>
<tspan x="56" y="538">THAT NO RUN ALERTED A HUMAN. THIS IS THE FIRST</tspan>
<tspan x="56" y="592.86">PAGE THAT ASKS WHAT A HUMAN COULD HAVE SAID</tspan>
<tspan x="56" y="647.71">BACK.”</tspan>
</text>
