<tspan x="56" y="176.57">FRAME — Five small labelled figures, drawn as the</tspan>
<tspan x="56" y="238.56">silhouettes of page 016: A VISITOR, A TEAM, A</tspan>
<tspan x="56" y="300.56">RESPONDER, AN EXECUTIVE, AN OUTSIDE</tspan>
<tspan x="56" y="362.55">INVESTIGATOR. A bracket tries to enclose them</tspan>
<tspan x="56" y="424.54">under one word, OPENAI, and fails to close.</tspan>
<tspan x="56" y="524.97">CAPTION — “&quot;OPENAI KNEW&quot; IS FIVE DIFFERENT</tspan>
<tspan x="56" y="586.96">CLAIMS. THE RECORD SUPPORTS AT MOST ONE</tspan>
<tspan x="56" y="648.96">OF THEM, ABOUT A VISITOR, BY INFERENCE.”</tspan>
</text>
