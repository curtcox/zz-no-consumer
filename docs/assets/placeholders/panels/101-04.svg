<text font-size="40.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="149.01">FRAME — The third argument, and the one the forum was</tspan>
<tspan x="56" y="203.53">built to surface. A defensive loop is drawn as a closed circuit:</tspan>
<tspan x="56" y="258.04">find, patch, deploy, roll back. A small human figure stands</tspan>
<tspan x="56" y="312.55">inside one segment of it. An arrow labeled REMOVE points</tspan>
<tspan x="56" y="367.07">at the figure. The talk&#x27;s stated reason is lettered beside it.</tspan>
<tspan x="56" y="455.38">SCREEN / SYSTEM TEXT — CITED, OPENAI AT BLACK</tspan>
<tspan x="56" y="509.89">HAT — “PARTIAL AUTOMATION FAILS. AUTOMATING</tspan>
<tspan x="56" y="564.41">DISCOVERY WITHOUT AUTOMATING PATCHING ONLY</tspan>
<tspan x="56" y="618.92">DROWNS THE ENGINEERS. THE LOOP NEEDS TO BE</tspan>
<tspan x="56" y="673.43">FULLY AUTOMATED IN ITS END STATE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE CASE FOR CONTINUING · PANEL 4 · PLACEHOLDER</text>
