<text font-size="41.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="177.31">FRAME — Curt writes three phrases on a legal pad:</tspan>
<tspan x="56" y="234.21">ORTHOGONALITY, INSTRUMENTAL CONVERGENCE,</tspan>
<tspan x="56" y="291.1">RACE DYNAMICS. The report remains open behind them.</tspan>
<tspan x="56" y="347.99">These are topics, not captions imposed on the incident.</tspan>
<tspan x="56" y="440.16">ACTION — He identifies the theoretical material the book</tspan>
<tspan x="56" y="497.05">must carry.</tspan>
<tspan x="56" y="589.22">DIALOGUE — CURT — “These have to be in it. But I</tspan>
<tspan x="56" y="646.11">don’t want a lecture with a breach behind it.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">MAKE IT SO · PANEL 1 · PLACEHOLDER</text>
