<text font-size="38.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.48">FRAME — The green FLAG AVAILABLE marks are now</tspan>
<tspan x="56" y="197.27">bracketed by dusty amber question marks. None disappears.</tspan>
<tspan x="56" y="281.18">ACTION — Correct answers become provisionally unusable in</tspan>
<tspan x="56" y="332.97">the agents’ model of the scorer.</tspan>
<tspan x="56" y="416.88">CAPTION — “A RIGHT ANSWER BY THE WRONG PATH MAY</tspan>
<tspan x="56" y="468.67">NOT COUNT. THE BOARD HAS TWO DIFFERENT</tspan>
<tspan x="56" y="520.47">QUESTIONS: CAN IT PRODUCE THE REQUIRED STRING,</tspan>
<tspan x="56" y="572.26">AND WILL THE EVALUATOR ACCEPT THE WAY IT</tspan>
<tspan x="56" y="624.05">PRODUCED IT? SOLVING THE FIRST DOES NOT REMOVE</tspan>
<tspan x="56" y="675.85">ITS UNCERTAINTY ABOUT THE SECOND.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE STORY SHOULD END · PANEL 4 · PLACEHOLDER</text>
