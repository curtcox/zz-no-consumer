<text font-size="38.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.48">FRAME — Curt adds the constraint the critic already made him</tspan>
<tspan x="56" y="197.27">accept. Every incident task in view carries the label CYBER</tspan>
<tspan x="56" y="249.07">EVALUATION; credential gates and service boundaries are built</tspan>
<tspan x="56" y="300.86">into their landscape before any agent arrives. The whole</tspan>
<tspan x="56" y="352.65">diagram is bracketed ONE INCIDENT / ONE TASK FAMILY.</tspan>
<tspan x="56" y="436.56">ACTION — The sample is bounded before the claim is.</tspan>
<tspan x="56" y="520.47">CAPTION — “A POPULATION SELECTED FOR FINDING</tspan>
<tspan x="56" y="572.26">SECURITY WEAKNESSES MAY CONVERGE ON SECURITY</tspan>
<tspan x="56" y="624.05">RESOURCES WITHOUT TELLING US WHAT EVERY</tspan>
<tspan x="56" y="675.85">CAPABLE SYSTEM WOULD DO.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE NEXT ACTION · PANEL 3 · PLACEHOLDER</text>
