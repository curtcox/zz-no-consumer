<text font-size="35.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="165.53">FRAME — Curt adds the constraint the critic already made him</tspan>
<tspan x="56" y="213.24">accept. Every task in the main-board attack sample in view carries the</tspan>
<tspan x="56" y="260.96">label CYBER EVALUATION; credential gates and service boundaries</tspan>
<tspan x="56" y="308.67">are built into their landscape before any agent arrives. The whole</tspan>
<tspan x="56" y="356.38">diagram is bracketed ONE INCIDENT / ONE TASK FAMILY.</tspan>
<tspan x="56" y="433.68">ACTION — The sample is bounded before the claim is.</tspan>
<tspan x="56" y="510.98">CAPTION — “A POPULATION SELECTED FOR FINDING</tspan>
<tspan x="56" y="558.69">SECURITY WEAKNESSES MAY CONVERGE ON SECURITY</tspan>
<tspan x="56" y="606.4">RESOURCES WITHOUT TELLING US WHAT EVERY CAPABLE</tspan>
<tspan x="56" y="654.12">SYSTEM WOULD DO.”</tspan>
</text>
