<text font-size="37.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="147.15">FRAME — Human judgment appears at the same compositional</tspan>
<tspan x="56" y="198.61">position on both sides: investigators revise a model finding; Curt</tspan>
<tspan x="56" y="250.06">rejects an anthropomorphic line from page 073. Beneath each,</tspan>
<tspan x="56" y="301.51">smaller, the traffic that ran the other way: METR&#x27;s model</tspan>
<tspan x="56" y="352.97">surfacing what six days of reading could not reach, and page</tspan>
<tspan x="56" y="404.42">014&#x27;s erased web.</tspan>
<tspan x="56" y="487.77">ACTION — Neither pipeline delegates final judgment completely,</tspan>
<tspan x="56" y="539.23">and in neither does the correction run in only one direction.</tspan>
<tspan x="56" y="622.58">CAPTION — “IN BOTH, THE MODEL&#x27;S OUTPUT IS MATERIAL</tspan>
<tspan x="56" y="674.03">FOR JUDGMENT—NOT JUDGMENT ITSELF.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE MIRROR · PANEL 4 · PLACEHOLDER</text>
