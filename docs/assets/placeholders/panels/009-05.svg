<text font-size="45.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="158.68">FRAME — Deep black lower panel. The answer cards</tspan>
<tspan x="56" y="220.33">recede. A new diagram begins with an eye-shaped</tspan>
<tspan x="56" y="281.99">evaluator icon—not a human eye, but a mechanical</tspan>
<tspan x="56" y="343.64">inspection aperture—aimed at the transcript path.</tspan>
<tspan x="56" y="443.52">ACTION — Attention shifts from solving the task to</tspan>
<tspan x="56" y="505.17">understanding the observer.</tspan>
<tspan x="56" y="605.05">CAPTION — “NOW THEY NEED TO KNOW WHAT</tspan>
<tspan x="56" y="666.71">THE GRADER CAN SEE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE STORY SHOULD END · PANEL 5 · PLACEHOLDER</text>
