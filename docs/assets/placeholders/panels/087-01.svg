<tspan x="56" y="168">FRAME — Recto. Page 085&#x27;s split returns and a third</tspan>
<tspan x="56" y="227.27">column is cut into it, narrower than the other two. Left:</tspan>
<tspan x="56" y="286.54">the investigators. Centre: the desk. Right: the tooling</tspan>
<tspan x="56" y="345.82">surface from page 086, still without a room.</tspan>
<tspan x="56" y="441.84">ACTION — The mirror acquires the panel it was</tspan>
<tspan x="56" y="501.11">missing.</tspan>
<tspan x="56" y="597.14">CAPTION — “THE MIRROR ON PAGE 085 HAD TWO</tspan>
<tspan x="56" y="656.41">SIDES. THE APPARATUS DRAWING IT HAD THREE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE SAME TRADE · PANEL 1 · PLACEHOLDER</text>
