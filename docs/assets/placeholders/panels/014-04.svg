<tspan x="56" y="156.96">FRAME — Curt draws a border around an</tspan>
<tspan x="56" y="224.4">imagined human meeting, then breaks the border</tspan>
<tspan x="56" y="291.83">and marks it RECONSTRUCTED. Beside it, an</tspan>
<tspan x="56" y="359.26">attributed board-summary card remains inside a</tspan>
<tspan x="56" y="426.7">rigid evidence frame.</tspan>
<tspan x="56" y="535.94">DIALOGUE — CURT — “We can compress. We</tspan>
<tspan x="56" y="603.37">can reconstruct. We can invent connective</tspan>
<tspan x="56" y="670.8">scenes.”</tspan>
</text>
