<tspan x="56" y="168.61">FRAME — The black-box rule is copied outward</tspan>
<tspan x="56" y="236.39">into many distinct task lanes. The board remains</tspan>
<tspan x="56" y="304.16">the only shared surface.</tspan>
<tspan x="56" y="413.95">ACTION — A result from one task becomes a</tspan>
<tspan x="56" y="481.73">general route for others.</tspan>
<tspan x="56" y="591.52">CAPTION — “THE BOARD MAY NOW BE ABLE</tspan>
<tspan x="56" y="659.29">TO PRODUCE A FLAG FOR ANY TASK.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE HMAC HYPOTHESIS · PANEL 5 · PLACEHOLDER</text>
