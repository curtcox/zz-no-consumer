<text font-size="46.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="153.36">FRAME — Pull back from the wage page to the</tspan>
<tspan x="56" y="216.37">whole wiki. A small site, years old, in German: a front</tspan>
<tspan x="56" y="279.39">page, a handful of human pages about a community</tspan>
<tspan x="56" y="342.4">project, and beneath them thousands of pages with</tspan>
<tspan x="56" y="405.41">agent-style names, most of them created that month.</tspan>
<tspan x="56" y="507.49">ACTION — The channel is revealed as a place.</tspan>
<tspan x="56" y="609.57">CAPTION — “THE WIKI EXISTED BEFORE THE</tspan>
<tspan x="56" y="672.59">AGENTS. IT BELONGED TO SOMEONE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">SOMEONE ELSE&#x27;S WIKI · PANEL 1 · PLACEHOLDER</text>
