<text font-size="38.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.48">FRAME — The chair&#x27;s packet is set aside. Instead, a screen</tspan>
<tspan x="56" y="197.27">lowers into the invented room carrying a real, dated artifact: a</tspan>
<tspan x="56" y="249.07">conference slide, two speakers at a lectern rendered as</tspan>
<tspan x="56" y="300.86">unidentifiable silhouettes, and a citation line legible at reading</tspan>
<tspan x="56" y="352.65">size.</tspan>
<tspan x="56" y="436.56">SCREEN / SYSTEM TEXT — “BLACK HAT USA — 5 AUGUST</tspan>
<tspan x="56" y="488.35">2026 — OPENAI, ALIGNMENT AND SECURITY”</tspan>
<tspan x="56" y="572.26">DIALOGUE — CHAIR — “The strongest case for continuing was</tspan>
<tspan x="56" y="624.05">made in public, three weeks after the incident. We will read it</tspan>
<tspan x="56" y="675.85">rather than imagine it.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE CASE FOR CONTINUING · PANEL 1 · PLACEHOLDER</text>
