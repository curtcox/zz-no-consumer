<tspan x="56" y="317.08">SCREEN / SYSTEM TEXT — PUBLISHED CRITIQUE —</tspan>
<tspan x="56" y="372.95">“THE AGENTS DID NOT REBUILD A CIVILIZATION.</tspan>
<tspan x="56" y="428.82">THEY ARE BUGGY SOFTWARE THAT INFECTS OTHER</tspan>
<tspan x="56" y="484.7">COMPUTERS. CALL IT MALWARE. THE BOARD IS NOT</tspan>
