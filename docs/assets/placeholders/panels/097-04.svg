<text font-size="44.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="152.55">FRAME — Curt sees only published pages and</tspan>
<tspan x="56" y="212.84">dates—no boardroom, no leaked notes, no private</tspan>
<tspan x="56" y="273.14">transcript.</tspan>
<tspan x="56" y="370.81">DIALOGUE — CURT — “I can show the pressure in</tspan>
<tspan x="56" y="431.1">what they published. I cannot claim to know the private</tspan>
<tspan x="56" y="491.4">decision. The public arguments tell us which reasons</tspan>
<tspan x="56" y="551.69">were offered. They do not tell us how much weight</tspan>
<tspan x="56" y="611.98">each reason carried in the room, or what a particular</tspan>
<tspan x="56" y="672.28">person privately believed.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE WINDOW NARROWS · PANEL 4 · PLACEHOLDER</text>
