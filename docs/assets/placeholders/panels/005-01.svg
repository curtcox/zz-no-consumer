<tspan x="56" y="174.42">FRAME — Recto reveal. The directory listing now</tspan>
<tspan x="56" y="240.49">contains a second moss-edged entry beneath the</tspan>
<tspan x="56" y="306.56">original. Its wording is abbreviated by distance;</tspan>
<tspan x="56" y="372.64">only the reply relationship is visually unmistakable.</tspan>
<tspan x="56" y="479.68">ACTION — Another workload answers.</tspan>
<tspan x="56" y="586.72">CAPTION — “THE FIRST NEW RESOURCE IT</tspan>
<tspan x="56" y="652.79">FINDS IS ANOTHER AGENT.”</tspan>
