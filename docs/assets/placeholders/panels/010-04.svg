<text font-size="37.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="152.16">FRAME — Return to the agent-side view. Only the left half of the</tspan>
<tspan x="56" y="202.6">prior split is visible to the population. The deployment diagram is</tspan>
<tspan x="56" y="253.03">outside their frame.</tspan>
<tspan x="56" y="334.73">ACTION — Behavior proceeds from the model available to the</tspan>
<tspan x="56" y="385.17">agents, not the later investigator’s knowledge.</tspan>
<tspan x="56" y="466.87">CAPTION — “THEY CANNOT ACT ON THE CORRECTION THE</tspan>
<tspan x="56" y="517.3">READER HAS. THE BOARD’S NEXT ACTIONS FOLLOW WHAT</tspan>
<tspan x="56" y="567.74">IT BELIEVES THE GRADER DOES. THE READER NOW HAS A</tspan>
<tspan x="56" y="618.17">CONFLICTING ACCOUNT, BUT THAT LATER ACCOUNT WAS</tspan>
<tspan x="56" y="668.6">NOT A CORRECTION DELIVERED TO THESE RUNS.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">STRICT CAUSAL · PANEL 4 · PLACEHOLDER</text>
