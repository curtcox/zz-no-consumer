<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 087 · IMAGE 02 OF 06</text>
<text font-size="34.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="143.52">FRAME — The left column, in the register page 075 used. The six-day</tspan>
<tspan x="56" y="190.89">clock. The transcripts that run past the panel edge. Beneath them,</tspan>
<tspan x="56" y="238.26">something page 077 never drew: the navigation tooling itself, built by a</tspan>
<tspan x="56" y="285.64">model so that the corpus could be pointed at.</tspan>
<tspan x="56" y="362.38">SCREEN / SYSTEM TEXT — INVESTIGATOR, 4 SEPTEMBER 2026</tspan>
<tspan x="56" y="409.75">(PARAPHRASED) — “WE USED A MODEL TO BUILD TOOLS THAT</tspan>
<tspan x="56" y="457.13">WOULD POINT US AT THE SMALL PARTS WORTH READING. THE</tspan>
<tspan x="56" y="504.5">TOOL COULD NOT READ A WHOLE TRANSCRIPT EITHER. IT</tspan>
<tspan x="56" y="551.87">DIVIDED THEM AMONG OTHER AGENTS.”</tspan>
<tspan x="56" y="628.62">ACTION — The instrument that made the record navigable was itself</tspan>
<tspan x="56" y="675.99">made by the instrument.</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE SAME TRADE · PANEL 2 · PLACEHOLDER</text>
