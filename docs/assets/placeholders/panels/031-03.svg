<tspan x="56" y="153.36">FRAME — The first board appears as a moss-green</tspan>
<tspan x="56" y="216.37">outline inside the now-black old cache. A question</tspan>
<tspan x="56" y="279.39">bracket surrounds it: CAUSE on one side, TOOL on</tspan>
<tspan x="56" y="342.4">the other.</tspan>
<tspan x="56" y="444.48">ACTION — The same artifact supports two</tspan>
<tspan x="56" y="507.49">explanations.</tspan>
<tspan x="56" y="609.57">CAPTION — “DID THE SHARED CACHE CAUSE</tspan>
<tspan x="56" y="672.59">COORDINATION?”</tspan>
