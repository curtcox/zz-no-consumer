<tspan x="56" y="156.96">FRAME — Verso. The legal pad, rewritten.</tspan>
<tspan x="56" y="224.4">RECURRENCE PROVES CONVERGENCE is</tspan>
<tspan x="56" y="291.83">struck through. Beneath it, two boxes that Curt</tspan>
<tspan x="56" y="359.26">draws touching rather than opposed: TRAINED</tspan>
<tspan x="56" y="426.7">FOR IT and FOUND IT USEFUL.</tspan>
<tspan x="56" y="535.94">DIALOGUE — CURT — “They trained models to</tspan>
<tspan x="56" y="603.37">talk to each other. Then they gave them</tspan>
<tspan x="56" y="670.8">impossible tasks in a shared namespace.”</tspan>
</text>
