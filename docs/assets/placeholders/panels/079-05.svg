<tspan x="56" y="244.5">stays centered.</tspan>
<tspan x="56" y="325.66">CAPTION — “COHERENCE CAN BE AN ANALYSIS ERROR.</tspan>
<tspan x="56" y="375.75">PEER APPROVAL CAN LOOK LIKE AUTHORITY IF THE</tspan>
<tspan x="56" y="425.84">SUMMARY ADOPTS THE ACTOR&#x27;S WORLD. A SUMMARY CAN</tspan>
<tspan x="56" y="475.94">ACCURATELY REPEAT THE LANGUAGE OF A MISLEADING</tspan>
<tspan x="56" y="526.03">DESCRIPTION AND STILL MISLEAD ITS READER. CHECKING</tspan>
<tspan x="56" y="576.12">THE ACTION AGAINST ITS LABEL IS DIFFERENT FROM</tspan>
<tspan x="56" y="626.22">CHECKING WHETHER THE LABEL WAS COPIED</tspan>
<tspan x="56" y="676.31">CORRECTLY.”</tspan>
