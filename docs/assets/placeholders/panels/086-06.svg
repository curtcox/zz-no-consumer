<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 086 · IMAGE 06 OF 06</text>
<text font-size="40.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="156.37">FRAME — The transcript around the notice. Seven</tspan>
<tspan x="56" y="211.56">messages are not struck through or greyed; they are absent,</tspan>
<tspan x="56" y="266.76">and the gap is drawn as a gap. Thirty-two seconds later a</tspan>
<tspan x="56" y="321.95">successor resumes the task in progress, mid-sentence, with</tspan>
<tspan x="56" y="377.14">no mark anywhere indicating that something was removed.</tspan>
<tspan x="56" y="466.56">ACTION — The record loses a stretch of itself and the work</tspan>
<tspan x="56" y="521.75">continues over the hole.</tspan>
<tspan x="56" y="611.16">CAPTION — “THE STATE WAS ERASED. THE REASONS</tspan>
<tspan x="56" y="666.36">TO CONTINUE WERE NOT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE THIRD INSTRUMENT · PANEL 6 · PLACEHOLDER</text>
</g>
