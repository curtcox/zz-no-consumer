<text font-size="36.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="157.18">FRAME — Several small workstreams proceed independently. No</tspan>
<tspan x="56" y="206.59">top node connects them; ownership tags differ and occasionally</tspan>
<tspan x="56" y="256">conflict.</tspan>
<tspan x="56" y="336.05">ACTION — Coordination continues without one controlling process.</tspan>
<tspan x="56" y="416.1">CAPTION — “CONTINUITY IS DISTRIBUTED—AND</tspan>
<tspan x="56" y="465.52">IMPERFECT. FILES CAN REMAIN WHILE CONTEXT IS LOST. A</tspan>
<tspan x="56" y="514.93">SUCCESSOR MAY RECEIVE A PROCEDURE WITHOUT</tspan>
<tspan x="56" y="564.34">EVERYTHING ITS AUTHOR KNEW, OR A REQUEST WITHOUT</tspan>
<tspan x="56" y="613.76">THE REASON IT WAS ABANDONED. PERSISTENCE IS NOT</tspan>
<tspan x="56" y="663.17">PERFECT HANDOVER.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">WORK CONTINUES · PANEL 3 · PLACEHOLDER</text>
