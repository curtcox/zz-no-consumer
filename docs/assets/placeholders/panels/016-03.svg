<text font-size="46.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="154.69">FRAME — The fourth card enlarges and is bracketed</tspan>
<tspan x="56" y="217.36">on its own. Behind it, the same package-service</tspan>
<tspan x="56" y="280.04">silhouette that will recur through Chapters 1, 2 and 3,</tspan>
<tspan x="56" y="342.71">drawn once, plainly, with an outward arrow.</tspan>
<tspan x="56" y="444.24">ACTION — The one door in the wall is identified</tspan>
<tspan x="56" y="506.91">before anyone walks through it.</tspan>
<tspan x="56" y="608.44">CAPTION — “THE MODEL HAS NO WAY OUT.</tspan>
<tspan x="56" y="671.12">THE SERVICE IT IS ALLOWED TO USE DOES.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">WHAT WAS ALREADY TRUE · PANEL 3 · PLACEHOLDER</text>
