<text font-size="40.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="149.01">FRAME — A response chart assigns severity, owner, stop</tspan>
<tspan x="56" y="203.53">authority, and restart authority. The empty ownership cell</tspan>
<tspan x="56" y="258.04">from the incident is now filled.</tspan>
<tspan x="56" y="346.35">CAPTION — “AN ALERT NEEDS AN OWNER. A PAUSE</tspan>
<tspan x="56" y="400.87">NEEDS AUTHORITY. A RESTART NEEDS A RULE.</tspan>
<tspan x="56" y="455.38">THESE ARE THREE SEPARATE POWERS: RECEIVE THE</tspan>
<tspan x="56" y="509.89">WARNING, STOP THE WORK, AND DECIDE WHETHER IT</tspan>
<tspan x="56" y="564.41">CAN SAFELY RESUME. A RULE ON PAPER DOES NOT</tspan>
<tspan x="56" y="618.92">COMPLETE THAT CHAIN UNLESS SOMEONE CAN ACT</tspan>
<tspan x="56" y="673.43">AT EACH STEP.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">BOUNDARIES WITH CONSEQUENCES · PANEL 4 · PLACEHOLDER</text>
