<text font-size="39.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="147.29">FRAME — Both sides address a channel that would carry an</tspan>
<tspan x="56" y="200.78">assurance. Left waits on a board message; right waits on a</tspan>
<tspan x="56" y="254.28">standard, a commitment, or a rival&#x27;s action. Both channels are</tspan>
<tspan x="56" y="307.77">drawn, and both are empty.</tspan>
<tspan x="56" y="394.43">LEFT DIALOGUE — AGENT — “I will hold if the others hold.”</tspan>
<tspan x="56" y="481.09">RIGHT DIALOGUE — INSTITUTIONAL ROLE — “We can</tspan>
<tspan x="56" y="534.58">slow if the field slows with us.”</tspan>
<tspan x="56" y="621.24">CAPTION — “EACH ACTOR WANTS A GUARANTEE IT</tspan>
<tspan x="56" y="674.74">CANNOT CREATE ALONE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">WAITING FOR THE OTHERS · PANEL 2 · PLACEHOLDER</text>
