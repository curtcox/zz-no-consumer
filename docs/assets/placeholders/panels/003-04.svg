<tspan x="56" y="153.36">FRAME — A command creates a test directory. Its</tspan>
<tspan x="56" y="216.37">name appears at the top of the listing. For the first</tspan>
<tspan x="56" y="279.39">time, a single muted moss-green rule edges the new</tspan>
<tspan x="56" y="342.4">row.</tspan>
<tspan x="56" y="444.48">ACTION — A write primitive becomes a signaling</tspan>
<tspan x="56" y="507.49">primitive.</tspan>
<tspan x="56" y="609.57">CAPTION — “A DIRECTORY NAME CAN CARRY</tspan>
<tspan x="56" y="672.59">MORE THAN A DIRECTORY NAME.”</tspan>
