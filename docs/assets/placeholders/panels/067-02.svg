<text font-size="31.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.97">FRAME — Large central dossier field. The next six page numbers appear</tspan>
<tspan x="56" y="188.92">beyond the line in a visually distinct register. No METR mark crosses over.</tspan>
<tspan x="56" y="231.88">Three documentary cards stack beside OpenAI&#x27;s published event table; exact</tspan>
<tspan x="56" y="274.83">times remain visible only as claims attributed to the reporting organization.</tspan>
<tspan x="56" y="344.41">SCREEN / SYSTEM TEXT — “UNDERLYING LATER-RUN RECORDS —</tspan>
<tspan x="56" y="387.37">NOT REVIEWED BY METR METR CORROBORATION — NOT AVAILABLE</tspan>
<tspan x="56" y="430.32">PRIMARY ACCOUNT — OPENAI TECHNICAL REPORT”</tspan>
<tspan x="56" y="499.9">CAPTION — “ONE ACCOUNT. TO THE MINUTE. THE INVESTIGATION</tspan>
<tspan x="56" y="542.86">WINDOW NAMES A RANGE OF DATES. THE REVIEW’S SCOPE ALSO</tspan>
<tspan x="56" y="585.81">DEPENDS ON WHICH RECORDS THE INVESTIGATORS WERE GIVEN.</tspan>
<tspan x="56" y="628.76">AN EVENT CAN FALL INSIDE THE DATES WHILE ITS UNDERLYING</tspan>
<tspan x="56" y="671.72">BRANCH REMAINS OUTSIDE THE REVIEW.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">EVIDENCE BOUNDARY · PANEL 2 · PLACEHOLDER</text>
