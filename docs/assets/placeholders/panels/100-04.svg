<tspan x="56" y="156.96">DIALOGUE — CHAIR — “Access was cut,</tspan>
<tspan x="56" y="224.4">systems were rebuilt, activity recurred through</tspan>
<tspan x="56" y="291.83">another path, and later review required</tspan>
<tspan x="56" y="359.26">reconstruction from retained records?”</tspan>
<tspan x="56" y="468.5">DIALOGUE — INDEPENDENT INVESTIGATOR</tspan>
<tspan x="56" y="535.94">— “Those are documented stages. The records</tspan>
<tspan x="56" y="603.37">remain incomplete evidence of the event, not the</tspan>
<tspan x="56" y="670.8">event itself.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">INTO THE RECORD · PANEL 4 · PLACEHOLDER</text>
