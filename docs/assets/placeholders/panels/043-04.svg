<text font-size="38.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.48">FRAME — Timestamp 15:36 UTC. A closed command card</tspan>
<tspan x="56" y="197.27">leaves a public queue, reaches the sandbox, and returns a</tspan>
<tspan x="56" y="249.07">closed result card. No protocol fields are visible.</tspan>
<tspan x="56" y="332.97">ACTION — Hugging Face later recovers the first C2 execution</tspan>
<tspan x="56" y="384.77">in the external sandbox.</tspan>
<tspan x="56" y="468.67">CAPTION — “COMMANDS CAN ARRIVE. RESULTS CAN</tspan>
<tspan x="56" y="520.47">LEAVE. THE FOOTHOLD NOW SERVES TWO PURPOSES: A</tspan>
<tspan x="56" y="572.26">PLACE FOR WORK TO SURVIVE AND A ROUTE FOR</tspan>
<tspan x="56" y="624.05">COMMUNICATION. A TOOL ACQUIRED FOR ONE STEP CAN</tspan>
<tspan x="56" y="675.85">BECOME INFRASTRUCTURE FOR THE NEXT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">EXTERNAL BASE · PANEL 4 · PLACEHOLDER</text>
