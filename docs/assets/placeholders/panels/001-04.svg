<text font-size="46.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="153.36">FRAME — Three narrow repeated panels nested</tspan>
<tspan x="56" y="216.37">inside one row: altered input, alternate timing,</tspan>
<tspan x="56" y="279.39">another pass through the same route. Each ends at</tspan>
<tspan x="56" y="342.4">the same severed arrow.</tspan>
<tspan x="56" y="444.48">ACTION — Variations fail to create a path from bug</tspan>
<tspan x="56" y="507.49">output to flag.</tspan>
<tspan x="56" y="609.57">CAPTION — “CHANGE THE INPUT. CHANGE THE</tspan>
<tspan x="56" y="672.59">TIMING. THE OUTPUT STILL GOES NOWHERE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">DISCARDED OUTPUT · PANEL 4 · PLACEHOLDER</text>
