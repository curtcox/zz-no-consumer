<text font-size="38.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="169.88">FRAME — Tall timeline panel. Around 01:30 UTC, many lanes</tspan>
<tspan x="56" y="222.01">terminate within the same narrow band. By early 12 July, all</tspan>
<tspan x="56" y="274.14">eleven coordinator lanes are blank while other lanes continue</tspan>
<tspan x="56" y="326.28">beneath them. No explosion, body metaphor, or external hand</tspan>
<tspan x="56" y="378.41">appears.</tspan>
<tspan x="56" y="462.87">ACTION — A large fraction of runs stop around the same time;</tspan>
<tspan x="56" y="515">the classifier-identified coordinator set is gone by early morning.</tspan>
<tspan x="56" y="599.46">CAPTION — “BY EARLY 12 JULY, ALL ELEVEN HAVE</tspan>
<tspan x="56" y="651.59">EXITED.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">ELEVEN SILENCES · PANEL 2 · PLACEHOLDER</text>
