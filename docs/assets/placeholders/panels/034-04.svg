<tspan x="56" y="153.36">FRAME — The first two blocks refuse to snap</tspan>
<tspan x="56" y="216.37">together. A dusty-amber bracket reads</tspan>
<tspan x="56" y="279.39">RELATIONSHIP NOT PUBLICLY MAPPED. The</tspan>
<tspan x="56" y="342.4">third block is connected only by forward time.</tspan>
<tspan x="56" y="444.48">ACTION — Uncertainty becomes the central</tspan>
<tspan x="56" y="507.49">evidence.</tspan>
<tspan x="56" y="609.57">CAPTION — “AT LEAST TWO BOARDS. MORE</tspan>
<tspan x="56" y="672.59">THAN ONE MECHANISM.”</tspan>
