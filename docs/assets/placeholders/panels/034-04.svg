<tspan x="56" y="150.37">FRAME — The first two blocks refuse to snap together. A</tspan>
<tspan x="56" y="206.92">dusty-amber bracket reads RELATIONSHIP NOT</tspan>
<tspan x="56" y="263.47">PUBLICLY MAPPED. The third block is connected only by</tspan>
<tspan x="56" y="320.03">forward time.</tspan>
<tspan x="56" y="411.64">ACTION — Uncertainty becomes the central evidence.</tspan>
<tspan x="56" y="503.26">CAPTION — “AT LEAST TWO BOARDS. MORE THAN</tspan>
<tspan x="56" y="559.81">ONE MECHANISM FOR LEAVING READABLE MARKS</tspan>
<tspan x="56" y="616.37">IN THE SERVICE. THEIR HISTORIES CANNOT BE</tspan>
<tspan x="56" y="672.92">COLLAPSED INTO ONE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">MORE THAN ONE · PANEL 4 · PLACEHOLDER</text>
