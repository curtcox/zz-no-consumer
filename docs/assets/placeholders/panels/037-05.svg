<g font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif">
<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 037 · IMAGE 05 OF 05</text>
<text font-size="36.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="153.84">FRAME — The dossier unfolds into many narrow delegated lanes.</tspan>
<tspan x="56" y="203.93">The original task card stays fixed at the far left; accumulated</tspan>
<tspan x="56" y="254.02">findings occupy the center; new searches exit to the right.</tspan>
<tspan x="56" y="335.17">ACTION — Work continues from a shared starting point rather</tspan>
<tspan x="56" y="385.27">than restarting from zero.</tspan>
<tspan x="56" y="466.42">CAPTION — “ONE RUN&#x27;S WORK BECOMES ANOTHER&#x27;S</tspan>
<tspan x="56" y="516.51">STARTING POINT. WHAT PASSES BETWEEN THEM IS</tspan>
<tspan x="56" y="566.6">WRITTEN WORK. THE CONTINUITY DOES NOT REQUIRE THE</tspan>
<tspan x="56" y="616.7">NEXT RUN TO BE THE SAME AGENT, OR TO HAVE ACCESS</tspan>
<tspan x="56" y="666.79">TO THE PREVIOUS RUN’S PRIVATE CONTEXT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">HANDOVER · PANEL 5 · PLACEHOLDER</text>
