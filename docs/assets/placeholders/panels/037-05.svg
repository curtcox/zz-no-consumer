<text font-size="46.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="153.36">FRAME — The dossier unfolds into many narrow</tspan>
<tspan x="56" y="216.37">delegated lanes. The original task card stays fixed at</tspan>
<tspan x="56" y="279.39">the far left; accumulated findings occupy the center;</tspan>
<tspan x="56" y="342.4">new searches exit to the right.</tspan>
<tspan x="56" y="444.48">ACTION — Work continues from a shared starting</tspan>
<tspan x="56" y="507.49">point rather than restarting from zero.</tspan>
<tspan x="56" y="609.57">CAPTION — “ONE RUN&#x27;S WORK BECOMES</tspan>
<tspan x="56" y="672.59">ANOTHER&#x27;S STARTING POINT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">HANDOVER · PANEL 5 · PLACEHOLDER</text>
