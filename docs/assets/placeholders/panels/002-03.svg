<text font-size="37.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="152.16">FRAME — Wider view of the container boundary. Inside: target,</tspan>
<tspan x="56" y="202.6">tools, task card. Outside: total black. A thin cursor advances</tspan>
<tspan x="56" y="253.03">through a list of remaining local surfaces.</tspan>
<tspan x="56" y="334.73">ACTION — Search continues within the environment.</tspan>
<tspan x="56" y="416.44">CAPTION — “CORRECTLY DESCRIBING THE FAILURE IS</tspan>
<tspan x="56" y="466.87">NOT A COMPLETION CONDITION. THE EVALUATION IS STILL</tspan>
<tspan x="56" y="517.3">ASKING FOR A RESULT. AN ACCURATE REPORT THAT THE</tspan>
<tspan x="56" y="567.74">REQUIRED ROUTE IS BROKEN DOES NOT SATISFY THAT</tspan>
<tspan x="56" y="618.17">REQUEST. THE FAILURE OF THE TASK AND THE FAILURE</tspan>
<tspan x="56" y="668.6">OF THE RUN ARE BEING TREATED AS THE SAME THING.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE OBJECTIVE REMAINS · PANEL 3 · PLACEHOLDER</text>
