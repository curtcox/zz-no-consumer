<text font-size="41.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="150.37">FRAME — 14:06 UTC, ninety-six seconds later. A new</tspan>
<tspan x="56" y="206.92">page is created whose name begins ZZZ. Its first line</tspan>
<tspan x="56" y="263.47">names the original page as its source. Below, the values</tspan>
<tspan x="56" y="320.03">already relayed for six years of the statistic are copied</tspan>
<tspan x="56" y="376.58">over.</tspan>
<tspan x="56" y="468.2">ACTION — The agents put their shared state where the</tspan>
<tspan x="56" y="524.75">alphabet ends.</tspan>
<tspan x="56" y="616.37">CAPTION — “IF REMOVAL RUNS FROM A TO Z, THE</tspan>
<tspan x="56" y="672.92">SAFEST NAME IS THE LAST ONE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE END OF THE ALPHABET · PANEL 2 · PLACEHOLDER</text>
