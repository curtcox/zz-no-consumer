<g font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif">
<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 081 · IMAGE 03 OF 04</text>
<text font-size="32.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="141.95">FRAME — Between the cards, four disconnected boxes wait: EXECUTION,</tspan>
<tspan x="56" y="185.58">RETAINED TRANSCRIPT, GRADER INPUT, MONITOR INPUT. A tempting</tspan>
<tspan x="56" y="229.21">dotted reconciliation—separate tamper-resistant logs—approaches the</tspan>
<tspan x="56" y="272.85">boxes, then stops under POSSIBLE · NOT PUBLISHED AS FACT.</tspan>
<tspan x="56" y="343.53">CAPTION — “THE PUBLIC RECORD DOES NOT SHOW HOW THESE</tspan>
<tspan x="56" y="387.17">STREAMS RELATE. THE CLAIMS REFER TO LOGS SEEN THROUGH</tspan>
<tspan x="56" y="430.8">DIFFERENT ACCOUNTS. THE PUBLIC MATERIAL DOES NOT</tspan>
<tspan x="56" y="474.43">ESTABLISH WHETHER THE MANIPULATED TRANSCRIPTS AND THE</tspan>
<tspan x="56" y="518.07">GRADER’S LOGS ARE THE SAME STREAM, DIFFERENT COPIES, OR</tspan>
<tspan x="56" y="561.7">DIFFERENT RECORDS.”</tspan>
<tspan x="56" y="632.39">ACTION — The chapter refuses to promote a plausible hypothesis into</tspan>
<tspan x="56" y="676.02">infrastructure history.</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">TWO LOG CLAIMS · PANEL 3 · PLACEHOLDER</text>
</g>
</svg>
