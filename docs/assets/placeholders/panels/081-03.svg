<text font-size="39.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="162.37">FRAME — Between the cards, four disconnected boxes wait:</tspan>
<tspan x="56" y="216.21">EXECUTION, RETAINED TRANSCRIPT, GRADER INPUT,</tspan>
<tspan x="56" y="270.04">MONITOR INPUT. A tempting dotted reconciliation—separate</tspan>
<tspan x="56" y="323.87">tamper-resistant logs—approaches the boxes, then stops</tspan>
<tspan x="56" y="377.71">under POSSIBLE · NOT PUBLISHED AS FACT.</tspan>
<tspan x="56" y="464.92">CAPTION — “THE PUBLIC RECORD DOES NOT SHOW</tspan>
<tspan x="56" y="518.75">HOW THESE STREAMS RELATE.”</tspan>
<tspan x="56" y="605.96">ACTION — The chapter refuses to promote a plausible</tspan>
<tspan x="56" y="659.79">hypothesis into infrastructure history.</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">TWO LOG CLAIMS · PANEL 3 · PLACEHOLDER</text>
