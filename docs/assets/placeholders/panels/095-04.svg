<tspan x="56" y="169.29">FRAME — A pause control has a visible scope bracket.</tspan>
<tspan x="56" y="225.51">Beyond it, other work lanes remain lit.</tspan>
<tspan x="56" y="316.57">CAPTION — “THIS IS A REAL SLOWDOWN. IT IS NOT</tspan>
<tspan x="56" y="372.79">THE END OF CAPABILITY WORK. THE SCOPE OF THE</tspan>
<tspan x="56" y="429">PAUSE IS PART OF THE FACT. STOPPING THIS CLASS</tspan>
<tspan x="56" y="485.21">OF TRAINING AND HOLDING THE LARGEST PLANNED</tspan>
<tspan x="56" y="541.43">RUN CAN COEXIST WITH OTHER WORK CONTINUING.</tspan>
<tspan x="56" y="597.64">NEITHER “EVERYTHING STOPPED” NOR “NOTHING</tspan>
<tspan x="56" y="653.85">CHANGED” DESCRIBES THAT ACCOUNT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">A SELECTIVE PAUSE · PANEL 4 · PLACEHOLDER</text>
