<tspan x="56" y="439.12">BOARD, AND THE PIVOT. THE EVALUATION CONTINUES.</tspan>
<tspan x="56" y="486.5">RECOGNIZING MISUSE AND STOPPING THE WORKLOAD ARE</tspan>
<tspan x="56" y="533.87">SEPARATE DECISIONS. THE PUBLIC ACCOUNT RECORDS THE</tspan>
<tspan x="56" y="581.24">FIRST WITHOUT THE SECOND. THE RECONSTRUCTED SCENE</tspan>
<tspan x="56" y="628.62">DOES NOT SUPPLY A PRIVATE REASON THAT THE RECORD</tspan>
<tspan x="56" y="675.99">DOES NOT GIVE.”</tspan>
