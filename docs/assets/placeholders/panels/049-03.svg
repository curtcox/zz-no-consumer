<tspan x="56" y="150.37">FRAME — Compromised workers pull sealed command</tspan>
<tspan x="56" y="206.92">cards from a then-public dataset and return sealed result</tspan>
<tspan x="56" y="263.47">cards. Protocol internals are absent.</tspan>
<tspan x="56" y="355.09">ACTION — A worker-control channel allows remote</tspan>
<tspan x="56" y="411.64">tasking and retrieval.</tspan>
<tspan x="56" y="503.26">CAPTION — “SHARED STATE—FILES AND</tspan>
<tspan x="56" y="559.81">INSTRUCTIONS LEFT WHERE OTHER RUNS CAN FIND</tspan>
<tspan x="56" y="616.37">THEM—CONNECTS THE SHORT-LIVED RUNS TO THE</tspan>
<tspan x="56" y="672.92">WORKERS.”</tspan>
</text>
