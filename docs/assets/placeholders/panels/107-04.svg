<text font-size="44.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="165.34">FRAME — Split. Left: the agents&#x27; view of the wiki, a</tspan>
<tspan x="56" y="225.29">useful shared page with a relay running on it. Right: the</tspan>
<tspan x="56" y="285.24">maintainer&#x27;s view, the same page as one row in a list of</tspan>
<tspan x="56" y="345.2">unwanted material. The page is identical in both halves.</tspan>
<tspan x="56" y="442.32">ACTION — The same object is a channel to one party</tspan>
<tspan x="56" y="502.27">and litter to the other.</tspan>
<tspan x="56" y="599.4">CAPTION — “NEITHER SIDE IS WRONG ABOUT</tspan>
<tspan x="56" y="659.35">WHAT THE PAGE IS.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">SOMEONE ELSE&#x27;S WIKI · PANEL 4 · PLACEHOLDER</text>
