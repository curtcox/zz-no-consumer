<g font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif">
<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 111 · IMAGE 01 OF 05</text>
<text font-size="34.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="147.2">FRAME — The two-lane calendar from page 109 becomes a map.</tspan>
<tspan x="56" y="193.89">Between the lanes, four boxes, each drawn as a question with a dotted</tspan>
<tspan x="56" y="240.58">outline and no arrow leaving it: COMMON ANCESTRY OR A TRAINED</tspan>
<tspan x="56" y="287.28">DISPOSITION TO COLLABORATE; TRAINING-TIME TRANSFER;</tspan>
<tspan x="56" y="333.97">COMMON INFRASTRUCTURE AND TIMED-TASK PRESSURE;</tspan>
<tspan x="56" y="380.66">DIRECT CONTACT OR A SHARED DISCOVERY CHANNEL. A fifth,</tspan>
<tspan x="56" y="427.36">smaller and further off: THE SEPARATE 26 MAY WORKLOAD.</tspan>
<tspan x="56" y="503">ACTION — The hypothesis table becomes visible without becoming</tspan>
<tspan x="56" y="549.69">plot.</tspan>
<tspan x="56" y="625.34">CAPTION — “EACH OF THESE WOULD EXPLAIN THE CALENDAR.</tspan>
<tspan x="56" y="672.03">NONE OF THEM IS IN THE RECORD.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">CONNECTIONS NOT YET DRAWN · PANEL 1 · PLACEHOLDER</text>
</g>
</svg>
