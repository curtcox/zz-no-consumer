<text font-size="36.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="144.32">FRAME — Left receives underlying transcripts, board dump,</tspan>
<tspan x="56" y="194.41">researcher interviews, and repeated data requests. Right receives</tspan>
<tspan x="56" y="244.5">published documents, selected excerpts, and no private</tspan>
<tspan x="56" y="294.6">interviews.</tspan>
<tspan x="56" y="375.75">CAPTION — “THEIR ACCESS IS NOT EQUIVALENT.</tspan>
<tspan x="56" y="425.84">INVESTIGATORS CAN EXAMINE SCOPED SOURCE</tspan>
<tspan x="56" y="475.94">MATERIAL THAT THIS BOOK RECEIVES THROUGH PUBLIC</tspan>
<tspan x="56" y="526.03">REPORTS. THE CREATOR HAS DIFFERENT ACCESS, A</tspan>
<tspan x="56" y="576.12">DIFFERENT PURPOSE AND DIFFERENT RESPONSIBILITIES.</tspan>
<tspan x="56" y="626.22">A SIMILAR TOOL DOES NOT MAKE THE TWO REVIEWS</tspan>
<tspan x="56" y="676.31">INTERCHANGEABLE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE MIRROR · PANEL 2 · PLACEHOLDER</text>
