<text font-size="34.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.36">FRAME — The 16:01 forensic row and the roughly 17:00</tspan>
<tspan x="56" y="192.39">discussion-name board sit in chronological order with a broken</tspan>
<tspan x="56" y="239.42">connector between them.</tspan>
<tspan x="56" y="315.62">ACTION — Recurrence is established while relationship remains</tspan>
<tspan x="56" y="362.65">unknown.</tspan>
<tspan x="56" y="438.84">CAPTION — “COMMUNICATION HAS RETURNED. THE PUBLIC</tspan>
<tspan x="56" y="485.88">RECORD DOES NOT ESTABLISH WHETHER THESE ARE THE</tspan>
<tspan x="56" y="532.91">SAME BEGINNING. A TIMESTAMPED WRITE AND A LATER</tspan>
<tspan x="56" y="579.94">OBSERVATION OF AN ACTIVE BOARD ARE DIFFERENT KINDS</tspan>
<tspan x="56" y="626.98">OF EVIDENCE. PUTTING THEM IN ORDER DOES NOT ESTABLISH</tspan>
<tspan x="56" y="674.01">THAT BOTH SOURCES ARE DESCRIBING ONE FOUNDING.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">EARLIER BOARD · PANEL 5 · PLACEHOLDER</text>
