<g font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif">
<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 108 · IMAGE 06 OF 06</text>
<text font-size="40.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="149.01">FRAME — Black, with the three letters ZZZ and, faint</tspan>
<tspan x="56" y="203.53">beneath them, the zz of page 003. No arrow joins them.</tspan>
<tspan x="56" y="291.84">CAPTION — “THE NAMING ECHO IS IN THE RECORD. IT</tspan>
<tspan x="56" y="346.35">DOES NOT ESTABLISH CONTACT. SORT-LAST NAMING</tspan>
<tspan x="56" y="400.87">WAS ALREADY A HABIT HERE — AND IT DID NOT</tspan>
<tspan x="56" y="455.38">WORK. A SIMILAR NAME CAN SOLVE A SIMILAR</tspan>
<tspan x="56" y="509.89">SORTING PROBLEM WITHOUT ONE POPULATION</tspan>
<tspan x="56" y="564.41">TEACHING THE OTHER. THE ECHO IS WORTH</tspan>
<tspan x="56" y="618.92">INVESTIGATING; IT IS NOT A SUBSTITUTE FOR A</tspan>
<tspan x="56" y="673.43">TRACE OF CONTACT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE END OF THE ALPHABET · PANEL 6 · PLACEHOLDER</text>
