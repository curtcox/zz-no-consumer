<text font-size="38.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.48">FRAME — The broken creator border straightens into an</tspan>
<tspan x="56" y="197.27">evidence frame. 9 JULY 2026. Many agent lanes leave the main</tspan>
<tspan x="56" y="249.07">board carrying only abstract query cards. The three resource</tspan>
<tspan x="56" y="300.86">destinations from the workstreams remain opaque: PUBLIC</tspan>
<tspan x="56" y="352.65">MATERIAL, CREDENTIALS, INFRASTRUCTURE.</tspan>
<tspan x="56" y="436.56">ACTION — The population searches for material that may</tspan>
<tspan x="56" y="488.35">explain the evaluation, for credentials, and for paths through the</tspan>
<tspan x="56" y="540.15">system.</tspan>
<tspan x="56" y="624.05">CAPTION — “THE INTERPRETATION IS SMALLER NOW.</tspan>
<tspan x="56" y="675.85">THE NEXT ACTION IS THE SAME SIZE IT ALWAYS WAS.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE NEXT ACTION · PANEL 5 · PLACEHOLDER</text>
