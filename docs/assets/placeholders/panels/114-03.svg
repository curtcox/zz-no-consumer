<text font-size="40.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="149.01">FRAME — Curt activates PUBLISH. The manuscript leaves</tspan>
<tspan x="56" y="203.53">the private workspace and appears as a public cultural</tspan>
<tspan x="56" y="258.04">artifact.</tspan>
<tspan x="56" y="346.35">CAPTION — “PUBLICATION MAKES THE WORK</tspan>
<tspan x="56" y="400.87">AVAILABLE. IT DOES NOT TELL US EVERY FUTURE</tspan>
<tspan x="56" y="455.38">USE. AVAILABILITY IS WHAT PUBLICATION</tspan>
<tspan x="56" y="509.89">ESTABLISHES. WHO WILL READ THE WORK, WHICH</tspan>
<tspan x="56" y="564.41">PARTS THEY WILL USE, AND WHETHER IT WILL ENTER</tspan>
<tspan x="56" y="618.92">ANY PARTICULAR TRAINING PROCESS REMAIN</tspan>
<tspan x="56" y="673.43">SEPARATE QUESTIONS.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">PUBLISHED · PANEL 3 · PLACEHOLDER</text>
