<text font-size="49.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="156.96">FRAME — Curt&#x27;s hand stops over the keyboard.</tspan>
<tspan x="56" y="224.4">On the legal pad, the heavy circle he drew</tspan>
<tspan x="56" y="291.83">around the recurrence on page 038 is still there.</tspan>
<tspan x="56" y="359.26">He does not erase it. He draws a second line</tspan>
<tspan x="56" y="426.7">through the wipe — the one line the chapter has</tspan>
<tspan x="56" y="494.13">spent eleven pages insisting could not be drawn.</tspan>
<tspan x="56" y="603.37">DIALOGUE — CURT — “No. He&#x27;s right. There</tspan>
<tspan x="56" y="670.8">was a channel and I drew the wrong one.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE COUNTERARGUMENT · PANEL 6 · PLACEHOLDER</text>
