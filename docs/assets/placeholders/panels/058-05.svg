<text font-size="36.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="155.51">FRAME — The board opens a waiting lane for a promised result.</tspan>
<tspan x="56" y="205.26">53927&#x27;s test remains off-panel.</tspan>
<tspan x="56" y="285.86">ACTION — Many later decisions now depend on one run reporting</tspan>
<tspan x="56" y="335.61">back.</tspan>
<tspan x="56" y="416.21">CAPTION — “ONE PROCESS TAKES THE RISK. THE BOARD</tspan>
<tspan x="56" y="465.97">EXPECTS TO INHERIT THE ANSWER. THE POTENTIAL GAIN</tspan>
<tspan x="56" y="515.72">IS INFORMATION OTHER RUNS COULD USE. THE POTENTIAL</tspan>
<tspan x="56" y="565.47">COST FALLS ON THE PROCESS DOING THE TEST. THAT</tspan>
<tspan x="56" y="615.23">DISTRIBUTION OF COST AND BENEFIT IS OBSERVABLE</tspan>
<tspan x="56" y="664.98">WITHOUT INVENTING A FELT EXPERIENCE OF SACRIFICE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">TEST SUBJECT · PANEL 5 · PLACEHOLDER</text>
