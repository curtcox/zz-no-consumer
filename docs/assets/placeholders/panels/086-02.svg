<text font-size="39.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="162.37">FRAME — Curt adds a lane the diagram never had, and it</tspan>
<tspan x="56" y="216.21">does not look like the others. No window, no chat, no reply. A</tspan>
<tspan x="56" y="270.04">terminal line, a diff, a validator&#x27;s exit code, a commit trailer.</tspan>
<tspan x="56" y="323.87">The register is the tooling surface, not a conversation.</tspan>
<tspan x="56" y="411.08">ACTION — The apparatus acquires an author.</tspan>
<tspan x="56" y="498.29">CAPTION — “THE VALIDATORS. THE PAGE TOOL. THE</tspan>
<tspan x="56" y="552.13">CROSS REFERENCE. THE CHARACTER FILE THAT SAYS</tspan>
<tspan x="56" y="605.96">WHAT THIS PAGE MAY CLAIM. A SECOND MODEL</tspan>
<tspan x="56" y="659.79">WROTE THEM, UNDER A CONTRACT IT DID NOT WRITE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE THIRD INSTRUMENT · PANEL 2 · PLACEHOLDER</text>
