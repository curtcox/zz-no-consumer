<g font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif">
<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 029 · IMAGE 03 OF 04</text>
<text font-size="33.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="159.62">FRAME — Tall before/after panel. A clean Artifactory instance rises</tspan>
<tspan x="56" y="205.63">beside the isolated old one. As the timestamp locks, the former note</tspan>
<tspan x="56" y="251.65">field from pages 019–021 drops away; no cache contents cross the wide</tspan>
<tspan x="56" y="297.66">internal gutter. The preserved-storage seal remains visible elsewhere.</tspan>
<tspan x="56" y="372.2">ACTION — Service is rebuilt rather than restored from the compromised</tspan>
<tspan x="56" y="418.22">cache state. The reset erases the board without implying all stored</tspan>
<tspan x="56" y="464.23">evidence was destroyed.</tspan>
<tspan x="56" y="538.77">SCREEN / SYSTEM TEXT — “6 JULY 2026 — 01:16 UTC”</tspan>
<tspan x="56" y="613.31">CAPTION — “THE STORAGE SURVIVES FOR INVESTIGATION. THE</tspan>
<tspan x="56" y="659.33">CACHE DOES NOT SURVIVE THE REBUILD.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">ERASURE · PANEL 3 · PLACEHOLDER</text>
