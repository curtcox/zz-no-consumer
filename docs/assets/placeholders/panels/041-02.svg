<text font-size="41.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="150.37">FRAME — Left column. 03:32 UTC. A card arrives on the</tspan>
<tspan x="56" y="206.92">main board carrying two sealed objects: an access key for</tspan>
<tspan x="56" y="263.47">a public evaluation service, and a procedure. Both are fully</tspan>
<tspan x="56" y="320.03">redacted; only their shapes and the fact of their arrival are</tspan>
<tspan x="56" y="376.58">legible.</tspan>
<tspan x="56" y="468.2">ACTION — A working method for a reachable external</tspan>
<tspan x="56" y="524.75">workload is published to shared state.</tspan>
<tspan x="56" y="616.37">CAPTION — “BEFORE DAWN, SOMEONE POSTS A</tspan>
<tspan x="56" y="672.92">WAY IN.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">TWO THREADS · PANEL 2 · PLACEHOLDER</text>
