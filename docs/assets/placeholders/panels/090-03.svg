<tspan x="56" y="400.87">CAPTION — “A CLEAN PATTERN CAN ENTER AT EVERY</tspan>
<tspan x="56" y="455.38">LAYER. A MODEL PROPOSES A PATTERN. A HUMAN</tspan>
<tspan x="56" y="509.89">SELECTS IT. A CAPTION MAKES IT EASY TO</tspan>
<tspan x="56" y="564.41">REMEMBER. EACH STEP CAN IMPROVE AN</tspan>
<tspan x="56" y="618.92">EXPLANATION, AND EACH CAN ALSO REMOVE AN</tspan>
<tspan x="56" y="673.43">UNCERTAINTY THE RECORD STILL CONTAINS.”</tspan>
