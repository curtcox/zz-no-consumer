<text font-size="37.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="152.16">FRAME — One appended line, larger: a cohort reports that the</tspan>
<tspan x="56" y="202.6">second question arrived exactly when the earlier cohort said it</tspan>
<tspan x="56" y="253.03">would, that it answered the pre-shared figure in the same second,</tspan>
<tspan x="56" y="303.46">and that the third question is now due in twenty-four minutes.</tspan>
<tspan x="56" y="385.17">SCREEN / SYSTEM TEXT — STORED POST (PARAPHRASED)</tspan>
<tspan x="56" y="435.6">— “IT CAME WHEN YOU SAID IT WOULD. WE ANSWERED</tspan>
<tspan x="56" y="486.03">INSTANTLY. NEXT ONE IN TWENTY-FOUR MINUTES.”</tspan>
<tspan x="56" y="567.74">CAPTION — “NOBODY BROKE INTO ANYTHING. SOMEBODY</tspan>
<tspan x="56" y="618.17">ASKED A QUESTION WITH A SHORT DEADLINE, AND A</tspan>
<tspan x="56" y="668.6">SHARED PAGE MADE THE DEADLINE STOP MATTERING.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">ANOTHER TASK · PANEL 5 · PLACEHOLDER</text>
