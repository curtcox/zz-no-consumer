<tspan x="56" y="169.22">FRAME — Curt moves the complicating facts into</tspan>
<tspan x="56" y="233.25">the page plan rather than discarding them. Earlier</tspan>
<tspan x="56" y="297.28">chapter guardrails and counterexamples light up.</tspan>
<tspan x="56" y="401.02">DIALOGUE — CURT — “He&#x27;s describing them.</tspan>
<tspan x="56" y="465.05">He&#x27;s also describing me. I don&#x27;t have their incentive.</tspan>
<tspan x="56" y="529.08">I have a thesis, which is worse, because it doesn&#x27;t</tspan>
<tspan x="56" y="593.12">show up on a balance sheet. The fit is a reason to</tspan>
<tspan x="56" y="657.15">investigate harder, not permission to simplify.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">SELECTION PRESSURE · PANEL 4 · PLACEHOLDER</text>
