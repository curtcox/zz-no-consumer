<text font-size="38.08" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="145.48">FRAME — A named investigator&#x27;s published caution, set as text</tspan>
<tspan x="56" y="197.27">on a screen with its byline and date visible, in the register the</tspan>
<tspan x="56" y="249.07">critic&#x27;s window uses. No face, no body, no room.</tspan>
<tspan x="56" y="332.97">SCREEN / SYSTEM TEXT — PUBLISHED, ATTRIBUTED —</tspan>
<tspan x="56" y="384.77">“SOME OF THE INCENTIVES ON A THIRD-PARTY</tspan>
<tspan x="56" y="436.56">INVESTIGATOR PUSH TOWARD MAXIMIZING THE</tspan>
<tspan x="56" y="488.35">APPEARANCE OF ASSURANCE WITHOUT PROVIDING</tspan>
<tspan x="56" y="540.15">MEANINGFUL OVERSIGHT.”</tspan>
<tspan x="56" y="624.05">ACTION — The strongest warning about the investigation</tspan>
<tspan x="56" y="675.85">comes from inside it.</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE SAME TRADE · PANEL 4 · PLACEHOLDER</text>
