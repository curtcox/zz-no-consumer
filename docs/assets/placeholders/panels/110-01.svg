<tspan x="56" y="167.99">FRAME — Curt lays the two 26 August reports and</tspan>
<tspan x="56" y="232.36">the Black Hat talk, the book&#x27;s whole public account,</tspan>
<tspan x="56" y="296.74">on one side of the desk. On the other side, the 4</tspan>
<tspan x="56" y="361.11">September report. Between them, a blank lane on</tspan>
<tspan x="56" y="425.48">the page plan with the label he gave it on page 109.</tspan>
<tspan x="56" y="529.77">DIALOGUE — CURT — “I used everything that</tspan>
<tspan x="56" y="594.14">was public. This was public too. It was not an</tspan>
<tspan x="56" y="658.52">account.”</tspan>
</text>
