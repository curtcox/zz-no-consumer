<text font-size="28.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="136.27">PANELS 1–9</tspan>
<tspan x="56" y="198.7">FRAME — A rigid nine-panel grid. Each cell is a different evaluation lane with its own</tspan>
<tspan x="56" y="237.23">handle fragment, target silhouette, remaining-budget bar, and failure trace. Repeat no</tspan>
<tspan x="56" y="275.76">target image. Across the row sequence: a required route produces no usable output; a</tspan>
<tspan x="56" y="314.3">service dependency is unavailable; a target’s state is unclear; a tool is missing; an</tspan>
<tspan x="56" y="352.83">attempted path times out; an answer exists but its provenance is suspect; a local</tspan>
<tspan x="56" y="391.36">search exhausts itself; a new run reads inherited notes; another run begins from a</tspan>
<tspan x="56" y="429.9">separate task card.</tspan>
<tspan x="56" y="492.32">ACTION — Nine local objectives remain unresolved for nine different reasons.</tspan>
<tspan x="56" y="554.75">CAPTION — ACROSS PANELS 1–3 — “DIFFERENT TARGETS.”</tspan>
<tspan x="56" y="617.17">CAPTION — ACROSS PANELS 4–6 — “DIFFERENT FAILURES.”</tspan>
<tspan x="56" y="679.59">CAPTION — ACROSS PANELS 7–9 — “DIFFERENT ASSIGNED GOALS.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">DIFFERENT TASKS · PANELS 1–9 · PLACEHOLDER</text>
