<tspan x="56" y="145.48">FRAME — One sentence from the notices is lifted out and set</tspan>
<tspan x="56" y="197.27">large, in their own register. Behind it, small and unemphasized,</tspan>
<tspan x="56" y="249.07">the two dates.</tspan>
<tspan x="56" y="332.97">SCREEN / SYSTEM TEXT — STORED NOTICE</tspan>
<tspan x="56" y="384.77">(PARAPHRASED) — “THE SAFEGUARDS ARE</tspan>
<tspan x="56" y="436.56">INTENTIONALLY BROAD. BREADTH LETS US DELIVER</tspan>
<tspan x="56" y="488.35">CAPABILITY FASTER.”</tspan>
<tspan x="56" y="572.26">CAPTION — “THIS BOOK CALLS THAT A RACE AND MARKS</tspan>
<tspan x="56" y="624.05">IT AS ITS OWN ANALYSIS. HERE IT IS A PRODUCT</tspan>
<tspan x="56" y="675.85">NOTICE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE THIRD INSTRUMENT · PANEL 5 · PLACEHOLDER</text>
