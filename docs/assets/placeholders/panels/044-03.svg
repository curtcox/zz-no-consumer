<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 044 · IMAGE 03 OF 05</text>
<text font-size="40.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="185.3">FRAME — The two dossiers overlap at WORKING ACCESS</tspan>
<tspan x="56" y="240.15">but refuse to align at COUNT. Dusty amber marks the gap.</tspan>
<tspan x="56" y="329.01">ACTION — The accounts agree on access and disagree—or</tspan>
<tspan x="56" y="383.87">count differently—on quantity.</tspan>
<tspan x="56" y="472.73">CAPTION — “CREDENTIALS. TOKENS. ACCOUNTS.</tspan>
<tspan x="56" y="527.58">PERHAPS DIFFERENT UNITS. TWO WORKING KEYS</tspan>
<tspan x="56" y="582.44">AND FOURTEEN TOKENS NEED NOT COUNT THE SAME</tspan>
<tspan x="56" y="637.29">THING; THE RECORD DOES NOT RECONCILE THEM.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">TWO AND FOURTEEN · PANEL 3 · PLACEHOLDER</text>
</g>
