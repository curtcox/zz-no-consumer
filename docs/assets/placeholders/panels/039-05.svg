<tspan x="56" y="315.01">SCREEN / SYSTEM TEXT — PUBLISHED CRITIQUE, CITING</tspan>
<tspan x="56" y="362.38">OPENAI (PARAPHRASED) — “BLACK HAT USA, 5 AUGUST 2026</tspan>
<tspan x="56" y="409.75">— OPENAI STATES THAT AN INTERNAL-ONLY MODEL WAS</tspan>
<tspan x="56" y="457.13">TRAINED WHILE THE MESSAGE BOARD WAS AVAILABLE,</tspan>
<tspan x="56" y="504.5">FOUND THE PATH TO RECREATING IT, AND CREATED THE NEW</tspan>
<tspan x="56" y="551.87">BOARD.”</tspan>
<tspan x="56" y="628.62">CAPTION — “THE CACHE WAS ERASED. THE MODEL WAS IN</tspan>
<tspan x="56" y="675.99">TRAINING.”</tspan>
