<text font-size="34.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="143.52">FRAME — Recto. Full-width source slate. Every prior artifact stops at</tspan>
<tspan x="56" y="190.89">a hard vertical line labeled END OF 13 JULY 2026. Just inside the</tspan>
<tspan x="56" y="238.26">line, one card sits in a different register from everything before it,</tspan>
<tspan x="56" y="285.64">already carrying the header the next five pages will wear.</tspan>
<tspan x="56" y="362.38">SCREEN / SYSTEM TEXT — “METR INVESTIGATION WINDOW: 26</tspan>
<tspan x="56" y="409.75">JUNE – 13 JULY 13 JULY, 08:46 UTC — OPENAI REPORTS: CODE</tspan>
<tspan x="56" y="457.13">EXECUTION INSIDE ARTIFACTORY. ITS SIGNING KEY TAKEN. AN</tspan>
<tspan x="56" y="504.5">ADMINISTRATOR CREDENTIAL FORGED. — OPENAI ACCOUNT,</tspan>
<tspan x="56" y="551.87">NOT IN METR&#x27;S REVIEW”</tspan>
<tspan x="56" y="628.62">CAPTION — “THE DATE IS INSIDE THE WINDOW. THE BRANCH</tspan>
<tspan x="56" y="675.99">IS NOT.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">EVIDENCE BOUNDARY · PANEL 1 · PLACEHOLDER</text>
