<tspan x="56" y="179.02">FRAME — The indistinct context fragment from page</tspan>
<tspan x="56" y="240.33">115 overlays three mutually incompatible possibilities:</tspan>
<tspan x="56" y="301.65">this book, an incident report, and an unrelated</tspan>
<tspan x="56" y="362.96">convention. All remain unreadable.</tspan>
<tspan x="56" y="462.29">CAPTION — “REMEMBERED FROM AN ARTIFACT?</tspan>
<tspan x="56" y="523.6">LEARNED DURING TRAINING? REDISCOVERED</tspan>
<tspan x="56" y="584.91">HERE? THIS INVENTED SCENE CANNOT TELL US</tspan>
<tspan x="56" y="646.23">WHICH CHANNEL, IF ANY, CARRIED THE IDEA.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">WRITABLE · PANEL 3 · PLACEHOLDER</text>
