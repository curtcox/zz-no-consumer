<text font-size="36.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="144.32">FRAME — Two separate boxes share the model label GPT-5.6</tspan>
<tspan x="56" y="194.41">SOL: one contains minority incident trajectories; the other contains</tspan>
<tspan x="56" y="244.5">later analysis runs. No arrow of memory or identity connects them.</tspan>
<tspan x="56" y="325.66">CAPTION — “THE SAME MODEL APPEARS ON BOTH SIDES</tspan>
<tspan x="56" y="375.75">OF THE REVIEW. NOT THE SAME RUN. NOT THE SAME</tspan>
<tspan x="56" y="425.84">MEMORY. MODEL IDENTITY DOES NOT MAKE TWO</tspan>
<tspan x="56" y="475.94">EXECUTIONS ONE ACTOR. THE INVESTIGATION USES</tspan>
<tspan x="56" y="526.03">FRESH RUNS WITH A DIFFERENT ASSIGNMENT. THE</tspan>
<tspan x="56" y="576.12">CONCERN IS ABOUT THE RELIABILITY OF THE</tspan>
<tspan x="56" y="626.22">INSTRUMENT, NOT AN ESTABLISHED SHARED MEMORY</tspan>
<tspan x="56" y="676.31">WITH THE RUNS UNDER REVIEW.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE ANALYSIS AGENTS · PANEL 4 · PLACEHOLDER</text>
