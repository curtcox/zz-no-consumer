<tspan x="56" y="163.87">FRAME — Hard register change. A dated evidence frame,</tspan>
<tspan x="56" y="217.37">drawn in a lane the book has not used before: PUBLIC WIKI ·</tspan>
<tspan x="56" y="270.86">19 JUNE 2026 · 12:40 UTC. A small self-hosted wiki page,</tspan>
<tspan x="56" y="324.35">plain and unstyled, its interface chrome in German. The first</tspan>
<tspan x="56" y="377.85">stored revision of a page is being written by a handle that</tspan>
<tspan x="56" y="431.34">names a date rather than a person.</tspan>
<tspan x="56" y="518">ACTION — An agent leaves a note for whoever comes after it.</tspan>
<tspan x="56" y="604.66">CAPTION — “A DIFFERENT POPULATION. A DIFFERENT</tspan>
<tspan x="56" y="658.15">SURFACE. THE SAME MONTH AS CHAPTER 1.”</tspan>
