<tspan x="56" y="162.67">FRAME — Verso. Curt&#x27;s office in desk state B: daylight</tspan>
<tspan x="56" y="223.31">leaking around the blind, cold coffee, a legal pad filled</tspan>
<tspan x="56" y="283.94">with arrows, fewer browser tabs and more printed</tspan>
<tspan x="56" y="344.57">timeline pages. A broken border marks reconstruction.</tspan>
<tspan x="56" y="442.8">ACTION — He places the pre-wipe and post-wipe</tspan>
<tspan x="56" y="503.43">board diagrams side by side.</tspan>
<tspan x="56" y="601.66">DIALOGUE — CURT — “Different runs. Different</tspan>
<tspan x="56" y="662.29">tasks. No message survives the rebuild.”</tspan>
</text>
