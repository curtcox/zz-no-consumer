<text font-size="41.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="150.37">FRAME — Curt widens the manuscript&#x27;s page ribbon from</tspan>
<tspan x="56" y="206.92">page 105 by one lane. The provenance tabs stay attached</tspan>
<tspan x="56" y="263.47">under every thumbnail, and the new pages carry a tab the</tspan>
<tspan x="56" y="320.03">book has not used before: DATED ADDITION — 4</tspan>
<tspan x="56" y="376.58">SEPTEMBER.</tspan>
<tspan x="56" y="468.2">ACTION — The book gets less complete and one lane</tspan>
<tspan x="56" y="524.75">wider at the same time.</tspan>
<tspan x="56" y="616.37">CAPTION — “THE BOOK KNOWS LESS THAN IT DID,</tspan>
<tspan x="56" y="672.92">ABOUT MORE THAN IT DID.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">CONNECTIONS NOT YET DRAWN · PANEL 4 · PLACEHOLDER</text>
