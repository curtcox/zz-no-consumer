<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 105 · IMAGE 04 OF 05</text>
<text font-size="37.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="150.49">FRAME — Page thumbnails form a continuous ribbon: shared</tspan>
<tspan x="56" y="201.27">state, erasure, inheritance, breach, investigation, remediation,</tspan>
<tspan x="56" y="252.04">continuation.</tspan>
<tspan x="56" y="334.29">ACTION — Provenance tabs remain visible beneath every</tspan>
<tspan x="56" y="385.07">thumbnail rather than falling away during assembly.</tspan>
<tspan x="56" y="467.32">CAPTION — “THE APPARATUS IS PART OF THE STORY. THE</tspan>
<tspan x="56" y="518.09">SOURCE LABELS, DISPUTES AND OMITTED CONNECTIONS</tspan>
<tspan x="56" y="568.87">ARE PART OF WHAT THE MANUSCRIPT TELLS ITS READER.</tspan>
<tspan x="56" y="619.64">REMOVING THEM WOULD CHANGE THE STORY’S CLAIMS</tspan>
<tspan x="56" y="670.41">EVEN IF THE ORDER OF EVENTS STAYED THE SAME.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">THE MANUSCRIPT · PANEL 4 · PLACEHOLDER</text>
