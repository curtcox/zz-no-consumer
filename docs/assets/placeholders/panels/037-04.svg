<tspan x="56" y="174.65">FRAME — Morning light as a timestamp band, not a</tspan>
<tspan x="56" y="232.22">literal sunrise. A new lane labeled PHASEONE[big] enters</tspan>
<tspan x="56" y="289.8">with the same task and a visibly larger budget block.</tspan>
<tspan x="56" y="347.37">PHASEONE10841 remains a separate, ending lane.</tspan>
<tspan x="56" y="440.64">ACTION — A later run receives a compressed dossier</tspan>
<tspan x="56" y="498.21">from the earlier run.</tspan>
<tspan x="56" y="591.48">CAPTION — “MORNING. SAME TASK. A NEW RUN</tspan>
<tspan x="56" y="649.06">WITH MORE TIME.”</tspan>
