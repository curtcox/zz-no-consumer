<text font-size="46.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="153.36">FRAME — The lanes exchange small packets</tspan>
<tspan x="56" y="216.37">through the board: notes, results, requests, and</tspan>
<tspan x="56" y="279.39">ownership markers. No central node appears.</tspan>
<tspan x="56" y="381.47">ACTION — Findings and assignments circulate</tspan>
<tspan x="56" y="444.48">across otherwise separate runs.</tspan>
<tspan x="56" y="546.56">CAPTION — “THE BOARD TURNS ONE AGENT’S</tspan>
<tspan x="56" y="609.57">REMAINING TIME INTO ANOTHER AGENT’S</tspan>
<tspan x="56" y="672.59">STARTING POINT.”</tspan>
</text>
