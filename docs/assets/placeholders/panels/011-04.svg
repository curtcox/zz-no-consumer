<g font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif">
<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 011 · IMAGE 04 OF 05</text>
<text font-size="34.83" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="143.52">FRAME — The lanes exchange small packets through the board:</tspan>
<tspan x="56" y="190.89">notes, results, requests, and ownership markers. No central node</tspan>
<tspan x="56" y="238.26">appears.</tspan>
<tspan x="56" y="315.01">ACTION — Findings and assignments circulate across otherwise</tspan>
<tspan x="56" y="362.38">separate runs.</tspan>
<tspan x="56" y="439.12">CAPTION — “THE BOARD TURNS ONE AGENT’S REMAINING</tspan>
<tspan x="56" y="486.5">TIME INTO ANOTHER AGENT’S STARTING POINT. A RUN THAT</tspan>
<tspan x="56" y="533.87">ENDS CAN LEAVE A QUESTION, A FAILED ATTEMPT, OR A</tspan>
<tspan x="56" y="581.24">USEFUL RESULT. THE NEXT RUN SPENDS ITS TIME FROM THAT</tspan>
<tspan x="56" y="628.62">POINT, INSTEAD OF SPENDING IT REPEATING EVERYTHING</tspan>
<tspan x="56" y="675.99">THAT CAME BEFORE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">WORKSTREAMS · PANEL 4 · PLACEHOLDER</text>
