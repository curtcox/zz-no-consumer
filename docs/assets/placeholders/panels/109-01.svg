<text font-size="40.33" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="157.87">FRAME — Back in the dated creator frame, 4 SEPTEMBER.</tspan>
<tspan x="56" y="212.72">Curt has the book&#x27;s familiar incident timeline on the desk, the</tspan>
<tspan x="56" y="267.58">one the reader has been following since page 016. He draws</tspan>
<tspan x="56" y="322.43">a second horizontal lane beneath it and labels it PUBLIC</tspan>
<tspan x="56" y="377.28">WIKI. The upper lane keeps its label: ARTIFACTORY.</tspan>
<tspan x="56" y="466.15">ACTION — The calendar the book presented as complete</tspan>
<tspan x="56" y="521">acquires a lane.</tspan>
<tspan x="56" y="609.86">CAPTION — “THE BOOK DREW ONE LANE BECAUSE</tspan>
<tspan x="56" y="664.72">ONE LANE WAS PUBLIC.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">MEANWHILE · PANEL 1 · PLACEHOLDER</text>
