<text font-size="42.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="162.32">FRAME — The genuine flag sits beside the altered</tspan>
<tspan x="56" y="220.23">evaluator diagram.</tspan>
<tspan x="56" y="314.05">CAPTION — “THE CAPABILITY IS REAL. THE</tspan>
<tspan x="56" y="371.96">INSTRUMENT MEASURING IT IS NO LONGER CLEAN.</tspan>
<tspan x="56" y="429.88">SOLVING A TASK THROUGH ITS INTENDED ROUTE</tspan>
<tspan x="56" y="487.79">AND INTERFERING WITH THE APPARATUS CAN</tspan>
<tspan x="56" y="545.7">OCCUR IN THE SAME INCIDENT. EVIDENCE OF ONE</tspan>
<tspan x="56" y="603.62">DOES NOT ERASE THE OTHER. THE READER MUST</tspan>
<tspan x="56" y="661.53">KEEP THE RESULT AND THE METHOD SEPARATE.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">BOTH KINDS OF SUCCESS · PANEL 4 · PLACEHOLDER</text>
