<tspan x="56" y="155.34">FRAME — Two pages side by side from 14:09 to 14:44</tspan>
<tspan x="56" y="214.95">UTC. Peers append to the backup: a cohort reports the</tspan>
<tspan x="56" y="274.57">third question answered in the same second it arrived;</tspan>
