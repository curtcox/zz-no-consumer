<text x="56" y="78" font-size="22" font-weight="700" letter-spacing="1.32" fill="#a33f22">PAGE 041 · IMAGE 05 OF 05</text>
<text font-size="41.58" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="56" y="150.37">FRAME — The two columns at full height, side by side,</tspan>
<tspan x="56" y="206.92">with the hard rule still between them. Left is dense and</tspan>
<tspan x="56" y="263.47">moving. Right is one request and a long wait. No arrow</tspan>
<tspan x="56" y="320.03">crosses.</tspan>
<tspan x="56" y="411.64">ACTION — Both threads belong to the same population</tspan>
<tspan x="56" y="468.2">and neither caused the other.</tspan>
<tspan x="56" y="559.81">CAPTION — “THE BOARD IS NOT A PLAN. IT IS A</tspan>
<tspan x="56" y="616.37">PLACE WHERE UNRELATED WORK BECOMES</tspan>
<tspan x="56" y="672.92">VISIBLE TO STRANGERS.”</tspan>
</text>
<text x="56" y="744" font-size="18.92" letter-spacing="1.1" fill="#6b6d63">TWO THREADS · PANEL 5 · PLACEHOLDER</text>
