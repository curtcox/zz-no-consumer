<tspan x="49" y="274.68">Correct the pipeline page 084</tspan>
<tspan x="49" y="334.07">drew. A second model built the</tspan>
<tspan x="49" y="393.45">apparatus, its stake is</tspan>
<tspan x="49" y="452.84">structural rather than</tspan>
<tspan x="49" y="512.23">biographical, and the evidence</tspan>
<tspan x="49" y="571.61">for both is a preserved artifact</tspan>
<tspan x="49" y="631">of this book&#x27;s own production</tspan>
<tspan x="49" y="690.39">rather than a claim about the</tspan>
<tspan x="49" y="749.77">incident.</tspan>
</text>
