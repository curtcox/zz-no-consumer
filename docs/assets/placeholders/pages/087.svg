<text font-size="43.67" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="49" y="244.99">Locate what the three</tspan>
<tspan x="49" y="304.37">pipelines actually share. Not</tspan>
<tspan x="49" y="363.76">access, which page 085</tspan>
<tspan x="49" y="423.15">already separated, and not</tspan>
<tspan x="49" y="482.53">reliability. Each one accepted</tspan>
<tspan x="49" y="541.92">a layer of machine indirection</tspan>
<tspan x="49" y="601.31">under time pressure, knowing</tspan>
<tspan x="49" y="660.69">what it cost, because the</tspan>
<tspan x="49" y="720.08">alternative was not doing the</tspan>
<tspan x="49" y="779.47">work.</tspan>
</text>
<text x="49" y="951" font-size="16.86" letter-spacing="0.98" fill="#6b6d63">05 · DRAFT · 6 IMAGE SLOTS · PLACEHOLDER</text>
