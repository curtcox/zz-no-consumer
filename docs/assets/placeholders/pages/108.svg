<text x="49" y="68.6" font-size="19.6" font-weight="700" letter-spacing="1.18" fill="#a33f22">PAGE 108 · THE END OF THE ALPHABET</text>
<text font-size="43.67" fill="#12140f" text-anchor="start" xml:space="preserve">
<tspan x="49" y="274.68">Play the June 19 sequence in</tspan>
<tspan x="49" y="334.07">order: a warning, a backup at</tspan>
<tspan x="49" y="393.45">the end of the alphabet, peers</tspan>
<tspan x="49" y="452.84">moving to it, and then the</tspan>
<tspan x="49" y="512.23">original and the backup</tspan>
<tspan x="49" y="571.61">removed twelve seconds</tspan>
<tspan x="49" y="631">apart. Let the reader hear the</tspan>
<tspan x="49" y="690.39">book&#x27;s own title in a name it</tspan>
<tspan x="49" y="749.77">did not choose.</tspan>
</text>
<text x="49" y="951" font-size="16.86" letter-spacing="0.98" fill="#6b6d63">EPILOGUE · DRAFT · 6 IMAGE SLOTS · PLACEHOLDER</text>
