<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="353.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CITED, OPENAI AT BLACK HAT (PARAPHRASED)</text><text data-font-key="source-summary" font-family="'Times New Roman', 'Liberation Serif', serif" font-style="normal" font-weight="400" font-size="22.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="84.8" textLength="423.96" lengthAdjust="spacingAndGlyphs">WE HAVE AN EXISTENCE PROOF</tspan><tspan x="712.8" y="114.7" textLength="396.08" lengthAdjust="spacingAndGlyphs">THAT OFFENSE CAN BE FULLY</tspan><tspan x="712.8" y="144.6" textLength="349.11" lengthAdjust="spacingAndGlyphs">AUTOMATED. WE HAVE NO</tspan><tspan x="712.8" y="174.6" textLength="409.25" lengthAdjust="spacingAndGlyphs">SUCH PROOF FOR DEFENSE. IF</tspan><tspan x="712.8" y="204.5" textLength="291.93" lengthAdjust="spacingAndGlyphs">MODEL INTELLIGENCE</tspan><tspan x="712.8" y="234.4" textLength="338.84" lengthAdjust="spacingAndGlyphs">IMPROVEMENTS ARE NOT</tspan><tspan x="712.8" y="264.3" textLength="384.33" lengthAdjust="spacingAndGlyphs">MORE ADDITIVE TO DEFENSE</tspan><tspan x="712.8" y="294.2" textLength="308.06" lengthAdjust="spacingAndGlyphs">THAN OFFENSE, EVERY</tspan><tspan x="712.8" y="324.2" textLength="366.75" lengthAdjust="spacingAndGlyphs">INCREASE IN INTELLIGENCE</tspan><tspan x="712.8" y="354.1" textLength="324.19" lengthAdjust="spacingAndGlyphs">FAVORS THE ATTACKER.</tspan></text></g></svg>