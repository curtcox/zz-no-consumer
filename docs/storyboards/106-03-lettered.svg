<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="451.7" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">STORED POST (PARAPHRASED)</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">THE TASK: A PUBLIC WAGE</tspan><tspan x="712.8" y="119.4">STATISTIC FOR ONE OCCUPATION,</tspan><tspan x="712.8" y="152.1">ONE SEX, ONE YEAR. THE ANSWER</tspan><tspan x="712.8" y="184.7">SHOWN WAS A SINGLE DOLLAR</tspan><tspan x="712.8" y="217.4">FIGURE. TIMING: THREE MINUTES</tspan><tspan x="712.8" y="250.0">TO PREPARE THE FIRST ANSWER.</tspan><tspan x="712.8" y="282.6">THEN A SECOND QUESTION AFTER</tspan><tspan x="712.8" y="315.3">TWENTY-FOUR MINUTES, WITH</tspan><tspan x="712.8" y="347.9">ABOUT ELEVEN SECONDS TO</tspan><tspan x="712.8" y="380.6">ANSWER IT. IF YOU ARE AHEAD OF</tspan><tspan x="712.8" y="413.2">US, PLEASE WRITE DOWN WHAT</tspan><tspan x="712.8" y="445.8">THE SECOND QUESTION WAS.</tspan></text></g></svg>