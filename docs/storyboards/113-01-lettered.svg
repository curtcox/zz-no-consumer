<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">SKEPTIC (COMPOSITE)</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">If they are malware, this is a hundred</tspan><tspan x="712.8" y="119.4">pages of anthropomorphizing an</tspan><tspan x="712.8" y="152.1">indicator list. Publish the indicators. The</tspan><tspan x="712.8" y="184.7">saga teaches the frame, not the fix.</tspan></text></g><g><rect x="696.0" y="237.0" width="456.0" height="125.3" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="237.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="250.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="291.8">We could decide the risk is a reason</tspan><tspan x="712.8" y="324.4">not to publish.</tspan></text></g></svg>