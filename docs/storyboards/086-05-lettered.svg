<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">STORED NOTICE (PARAPHRASED)</text><text data-font-key="source-summary" font-family="'Times New Roman', 'Liberation Serif', serif" font-style="normal" font-weight="400" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8" textLength="331.26" lengthAdjust="spacingAndGlyphs">THE SAFEGUARDS ARE</tspan><tspan x="712.8" y="119.4" textLength="344.07" lengthAdjust="spacingAndGlyphs">INTENTIONALLY BROAD.</tspan><tspan x="712.8" y="152.1" textLength="396.89" lengthAdjust="spacingAndGlyphs">BREADTH LETS US DELIVER</tspan><tspan x="712.8" y="184.7" textLength="296.09" lengthAdjust="spacingAndGlyphs">CAPABILITY FASTER.</tspan></text></g><g><rect x="696.0" y="237.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="narration" font-family="Georgia, 'Times New Roman', serif" font-style="normal" font-weight="400" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="277.8" textLength="360.40" lengthAdjust="spacingAndGlyphs">THIS BOOK CALLS THAT A</tspan><tspan x="712.8" y="310.4" textLength="385.55" lengthAdjust="spacingAndGlyphs">RACE AND MARKS IT AS ITS</tspan><tspan x="712.8" y="343.0" textLength="404.47" lengthAdjust="spacingAndGlyphs">OWN ANALYSIS. HERE IT IS A</tspan><tspan x="712.8" y="375.7" textLength="262.75" lengthAdjust="spacingAndGlyphs">PRODUCT NOTICE.</tspan></text></g></svg>