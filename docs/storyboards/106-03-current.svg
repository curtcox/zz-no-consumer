<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="451.7" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">STORED POST (PARAPHRASED)</text><text data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="700" font-size="20.8" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="83.5" textLength="326.56" lengthAdjust="spacingAndGlyphs">THE TASK: A PUBLIC WAGE</tspan><tspan x="712.8" y="111.8" textLength="420.38" lengthAdjust="spacingAndGlyphs">STATISTIC FOR ONE OCCUPATION,</tspan><tspan x="712.8" y="140.0" textLength="311.60" lengthAdjust="spacingAndGlyphs">ONE SEX, ONE YEAR. THE</tspan><tspan x="712.8" y="168.2" textLength="390.46" lengthAdjust="spacingAndGlyphs">ANSWER SHOWN WAS A SINGLE</tspan><tspan x="712.8" y="196.4" textLength="393.18" lengthAdjust="spacingAndGlyphs">DOLLAR FIGURE. TIMING: THREE</tspan><tspan x="712.8" y="224.7" textLength="408.14" lengthAdjust="spacingAndGlyphs">MINUTES TO PREPARE THE FIRST</tspan><tspan x="712.8" y="252.9" textLength="322.42" lengthAdjust="spacingAndGlyphs">ANSWER. THEN A SECOND</tspan><tspan x="712.8" y="281.1" textLength="402.66" lengthAdjust="spacingAndGlyphs">QUESTION AFTER TWENTY-FOUR</tspan><tspan x="712.8" y="309.3" textLength="380.94" lengthAdjust="spacingAndGlyphs">MINUTES, WITH ABOUT ELEVEN</tspan><tspan x="712.8" y="337.5" textLength="399.99" lengthAdjust="spacingAndGlyphs">SECONDS TO ANSWER IT. IF YOU</tspan><tspan x="712.8" y="365.8" textLength="417.71" lengthAdjust="spacingAndGlyphs">ARE AHEAD OF US, PLEASE WRITE</tspan><tspan x="712.8" y="394.0" textLength="323.74" lengthAdjust="spacingAndGlyphs">DOWN WHAT THE SECOND</tspan><tspan x="712.8" y="422.2" textLength="197.28" lengthAdjust="spacingAndGlyphs">QUESTION WAS.</tspan></text></g></svg>