<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="inference" font-family="'Trebuchet MS', Arial, sans-serif" font-style="italic" font-weight="400" font-size="18.5" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="659.3" textLength="1022.67" lengthAdjust="spacingAndGlyphs">A CLEAN PATTERN CAN ENTER AT EVERY LAYER. A MODEL PROPOSES A PATTERN. A HUMAN</tspan><tspan x="70.8" y="684.5" textLength="942.50" lengthAdjust="spacingAndGlyphs">SELECTS IT. A CAPTION MAKES IT EASY TO REMEMBER. EACH STEP CAN IMPROVE AN</tspan><tspan x="70.8" y="709.6" textLength="1049.75" lengthAdjust="spacingAndGlyphs">EXPLANATION, AND EACH CAN ALSO REMOVE AN UNCERTAINTY THE RECORD STILL CONTAINS.</tspan></text></g></svg>