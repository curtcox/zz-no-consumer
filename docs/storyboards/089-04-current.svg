<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="288.5" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">He&#x27;s describing them. He&#x27;s also</tspan><tspan x="712.8" y="119.4">describing me. I don&#x27;t have their</tspan><tspan x="712.8" y="152.1">incentive. I have a thesis, which is</tspan><tspan x="712.8" y="184.7">worse, because it doesn&#x27;t show up on a</tspan><tspan x="712.8" y="217.4">balance sheet. The fit is a reason to</tspan><tspan x="712.8" y="250.0">investigate harder, not permission to</tspan><tspan x="712.8" y="282.6">simplify.</tspan></text></g></svg>