<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="255.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">REPORT, 4 SEPTEMBER 2026 (PARAPHRASED)</text><text data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="700" font-size="22.8" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="85.5" textLength="325.20" lengthAdjust="spacingAndGlyphs">AS OF THIS REPORT, ITS</tspan><tspan x="712.8" y="116.5" textLength="411.69" lengthAdjust="spacingAndGlyphs">AUTHORS STATE THAT OPENAI</tspan><tspan x="712.8" y="147.4" textLength="420.66" lengthAdjust="spacingAndGlyphs">HAD NOT PUBLICLY DISCLOSED</tspan><tspan x="712.8" y="178.4" textLength="402.70" lengthAdjust="spacingAndGlyphs">THE WIKI INCIDENT, AND THAT</tspan><tspan x="712.8" y="209.3" textLength="395.29" lengthAdjust="spacingAndGlyphs">THE 26 AUGUST REPORTS DO</tspan><tspan x="712.8" y="240.2" textLength="386.35" lengthAdjust="spacingAndGlyphs">NOT EXPLICITLY MENTION IT.</tspan></text></g></svg>