<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="54.0" y="624.0" width="1092.0" height="16.0" fill="#202326"/><text x="70.8" y="637.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">INDEPENDENT INVESTIGATOR</text><text data-font-key="human" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="400" font-size="21.2" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="676.0" textLength="1056.80" lengthAdjust="spacingAndGlyphs">A voluntary pause can reduce one actor&#x27;s risk. It cannot, by itself, bind the field. Even if one organization</tspan><tspan x="70.8" y="704.9" textLength="1048.45" lengthAdjust="spacingAndGlyphs">keeps its promise, other organizations still make their own decisions. A common threshold needs a way</tspan><tspan x="70.8" y="733.8" textLength="942.67" lengthAdjust="spacingAndGlyphs">to become binding across those separate decisions, and a way to tell whether it is being met.</tspan></text></g></svg>