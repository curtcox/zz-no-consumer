<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="explanation" font-family="Palatino, 'Palatino Linotype', serif" font-style="normal" font-weight="400" font-size="16.8" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="657.5" textLength="1058.85" lengthAdjust="spacingAndGlyphs">THIS IS A REAL SLOWDOWN. IT IS NOT THE END OF CAPABILITY WORK. THE SCOPE OF THE PAUSE IS PART</tspan><tspan x="70.8" y="680.3" textLength="992.88" lengthAdjust="spacingAndGlyphs">OF THE FACT. STOPPING THIS CLASS OF TRAINING AND HOLDING THE LARGEST PLANNED RUN CAN</tspan><tspan x="70.8" y="703.1" textLength="1040.80" lengthAdjust="spacingAndGlyphs">COEXIST WITH OTHER WORK CONTINUING. NEITHER “EVERYTHING STOPPED” NOR “NOTHING CHANGED”</tspan><tspan x="70.8" y="725.9" textLength="284.78" lengthAdjust="spacingAndGlyphs">DESCRIBES THAT ACCOUNT.</tspan></text></g></svg>