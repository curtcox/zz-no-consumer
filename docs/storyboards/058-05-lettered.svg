<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="explanation" font-family="Palatino, 'Palatino Linotype', serif" font-style="normal" font-weight="400" font-size="16.8" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="657.5" textLength="1052.13" lengthAdjust="spacingAndGlyphs">ONE PROCESS TAKES THE RISK. THE BOARD EXPECTS TO INHERIT THE ANSWER. THE POTENTIAL GAIN IS</tspan><tspan x="70.8" y="680.3" textLength="1001.80" lengthAdjust="spacingAndGlyphs">INFORMATION OTHER RUNS COULD USE. THE POTENTIAL COST FALLS ON THE PROCESS DOING THE</tspan><tspan x="70.8" y="703.1" textLength="949.34" lengthAdjust="spacingAndGlyphs">TEST. THAT DISTRIBUTION OF COST AND BENEFIT IS OBSERVABLE WITHOUT INVENTING A FELT</tspan><tspan x="70.8" y="725.9" textLength="281.46" lengthAdjust="spacingAndGlyphs">EXPERIENCE OF SACRIFICE.</tspan></text></g></svg>