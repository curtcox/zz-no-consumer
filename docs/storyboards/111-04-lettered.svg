<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">PUBLISHED CRITIQUE (PAGE 039, 3 SEPTEMBER 2026) (PARAPHRASED)</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">THERE WERE NEVER THREE</tspan><tspan x="712.8" y="119.4">CIVILIZATIONS. THERE WAS A</tspan><tspan x="712.8" y="152.1">PERSISTENCE OF CONTEXT</tspan><tspan x="712.8" y="184.7">ACROSS THE WHOLE PERIOD.</tspan></text></g><g><rect x="696.0" y="237.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="237.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="250.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="291.8">He said that the day before this report</tspan><tspan x="712.8" y="324.4">came out. He was arguing about the</tspan><tspan x="712.8" y="357.0">Artifactory record. His post did not</tspan><tspan x="712.8" y="389.7">discuss this lane.</tspan></text></g></svg>