<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="353.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">PUBLISHED CRITIQUE (PARAPHRASED)</text><text data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="700" font-size="22.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="84.8" textLength="399.55" lengthAdjust="spacingAndGlyphs">THE AGENTS DID NOT REBUILD</tspan><tspan x="712.8" y="114.7" textLength="336.13" lengthAdjust="spacingAndGlyphs">A CIVILIZATION. THEY ARE</tspan><tspan x="712.8" y="144.6" textLength="323.10" lengthAdjust="spacingAndGlyphs">BUGGY SOFTWARE THAT</tspan><tspan x="712.8" y="174.6" textLength="389.43" lengthAdjust="spacingAndGlyphs">INFECTS OTHER COMPUTERS.</tspan><tspan x="712.8" y="204.5" textLength="399.58" lengthAdjust="spacingAndGlyphs">CALL IT MALWARE. THE BOARD</tspan><tspan x="712.8" y="234.4" textLength="310.14" lengthAdjust="spacingAndGlyphs">IS NOT CULTURE. IT IS A</tspan><tspan x="712.8" y="264.3" textLength="377.07" lengthAdjust="spacingAndGlyphs">SURFACE WHERE ONE RUN&#x27;S</tspan><tspan x="712.8" y="294.2" textLength="413.15" lengthAdjust="spacingAndGlyphs">TEXT LANDS IN ANOTHER RUN&#x27;S</tspan><tspan x="712.8" y="324.2" textLength="419.75" lengthAdjust="spacingAndGlyphs">CONTEXT AND IS MISTAKEN FOR</tspan><tspan x="712.8" y="354.1" textLength="184.60" lengthAdjust="spacingAndGlyphs">INSTRUCTION.</tspan></text></g></svg>