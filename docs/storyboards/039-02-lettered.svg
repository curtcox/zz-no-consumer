<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="353.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">PUBLISHED CRITIQUE</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">THE AGENTS DID NOT REBUILD A</tspan><tspan x="712.8" y="119.4">CIVILIZATION. THEY ARE BUGGY</tspan><tspan x="712.8" y="152.1">SOFTWARE THAT INFECTS OTHER</tspan><tspan x="712.8" y="184.7">COMPUTERS. CALL IT MALWARE.</tspan><tspan x="712.8" y="217.4">THE BOARD IS NOT CULTURE. IT IS</tspan><tspan x="712.8" y="250.0">A SURFACE WHERE ONE RUN&#x27;S</tspan><tspan x="712.8" y="282.6">TEXT LANDS IN ANOTHER RUN&#x27;S</tspan><tspan x="712.8" y="315.3">CONTEXT AND IS MISTAKEN FOR</tspan><tspan x="712.8" y="347.9">INSTRUCTION.</tspan></text></g></svg>