<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="353.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CITED, OPENAI AT BLACK HAT (PARAPHRASED)</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">WE HAVE AN EXISTENCE PROOF</tspan><tspan x="712.8" y="119.4">THAT OFFENSE CAN BE FULLY</tspan><tspan x="712.8" y="152.1">AUTOMATED. WE HAVE NO SUCH</tspan><tspan x="712.8" y="184.7">PROOF FOR DEFENSE. IF MODEL</tspan><tspan x="712.8" y="217.4">INTELLIGENCE IMPROVEMENTS</tspan><tspan x="712.8" y="250.0">ARE NOT MORE ADDITIVE TO</tspan><tspan x="712.8" y="282.6">DEFENSE THAN OFFENSE, EVERY</tspan><tspan x="712.8" y="315.3">INCREASE IN INTELLIGENCE</tspan><tspan x="712.8" y="347.9">FAVORS THE ATTACKER.</tspan></text></g></svg>