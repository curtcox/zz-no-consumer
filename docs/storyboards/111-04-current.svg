<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">PUBLISHED CRITIQUE (PAGE 039, 3 SEPTEMBER 2026) (PARAPHRASED)</text><text data-font-key="source-summary" font-family="'Times New Roman', 'Liberation Serif', serif" font-style="normal" font-weight="400" font-size="23.8" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.5" textLength="400.62" lengthAdjust="spacingAndGlyphs">THERE WERE NEVER THREE</tspan><tspan x="712.8" y="118.8" textLength="414.93" lengthAdjust="spacingAndGlyphs">CIVILIZATIONS. THERE WAS A</tspan><tspan x="712.8" y="151.2" textLength="392.73" lengthAdjust="spacingAndGlyphs">PERSISTENCE OF CONTEXT</tspan><tspan x="712.8" y="183.5" textLength="422.83" lengthAdjust="spacingAndGlyphs">ACROSS THE WHOLE PERIOD.</tspan></text></g><g><rect x="696.0" y="237.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="237.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="250.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text data-font-key="human" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="400" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="291.8" textLength="358.76" lengthAdjust="spacingAndGlyphs">He said that the day before this</tspan><tspan x="712.8" y="324.4" textLength="376.00" lengthAdjust="spacingAndGlyphs">report came out. He was arguing</tspan><tspan x="712.8" y="357.0" textLength="420.66" lengthAdjust="spacingAndGlyphs">about the Artifactory record. His post</tspan><tspan x="712.8" y="389.7" textLength="282.37" lengthAdjust="spacingAndGlyphs">did not discuss this lane.</tspan></text></g></svg>