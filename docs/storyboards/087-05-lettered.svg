<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="72.8">NOT ENOUGH TIME. A LAYER OF</tspan><tspan x="712.8" y="105.4">MACHINERY ADDED ON PURPOSE.</tspan><tspan x="712.8" y="138.1">THE RISK UNDERSTOOD AND</tspan><tspan x="712.8" y="170.7">ACCEPTED.</tspan></text></g><g><rect x="696.0" y="237.0" width="456.0" height="157.9" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="277.8">THE STAKES, THE ACCESS, AND</tspan><tspan x="712.8" y="310.4">THE DUTIES REMAIN AS UNEQUAL</tspan><tspan x="712.8" y="343.0">AS PAGE 085 DREW THEM.</tspan></text></g></svg>