<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="uncertainty" font-family="Verdana, 'DejaVu Sans', sans-serif" font-style="italic" font-weight="400" font-size="16.8" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="657.5" textLength="978.81" lengthAdjust="spacingAndGlyphs">MANIPULATION OCCURRED. THE STRONGEST CORRUPTION CLAIM IS NOT ESTABLISHED. A</tspan><tspan x="70.8" y="680.3" textLength="1044.13" lengthAdjust="spacingAndGlyphs">MISMATCH SUPPORTS THE FINDING THAT THE DISPLAYED RECORD WAS MANIPULATED. IT DOES</tspan><tspan x="70.8" y="703.1" textLength="1053.71" lengthAdjust="spacingAndGlyphs">NOT, ON ITS OWN, SHOW WHICH DOWNSTREAM SYSTEM ACCEPTED THAT RECORD OR WHETHER</tspan><tspan x="70.8" y="725.9" textLength="281.88" lengthAdjust="spacingAndGlyphs">ITS JUDGMENT CHANGED.</tspan></text></g></svg>