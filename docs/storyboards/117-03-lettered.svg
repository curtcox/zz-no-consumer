<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="uncertainty" font-family="Verdana, 'DejaVu Sans', sans-serif" font-style="italic" font-weight="400" font-size="22.5" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="663.3" textLength="953.96" lengthAdjust="spacingAndGlyphs">REMEMBERED FROM AN ARTIFACT? LEARNED DURING TRAINING?</tspan><tspan x="70.8" y="693.9" textLength="1045.01" lengthAdjust="spacingAndGlyphs">REDISCOVERED HERE? THIS INVENTED SCENE CANNOT TELL US WHICH</tspan><tspan x="70.8" y="724.5" textLength="549.34" lengthAdjust="spacingAndGlyphs">CHANNEL, IF ANY, CARRIED THE IDEA.</tspan></text></g></svg>