<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="255.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text data-font-key="human" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="400" font-size="22.8" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="85.5" textLength="401.50" lengthAdjust="spacingAndGlyphs">It was public the whole time and I did</tspan><tspan x="712.8" y="116.5" textLength="421.99" lengthAdjust="spacingAndGlyphs">not find it. The September report made</tspan><tspan x="712.8" y="147.4" textLength="401.45" lengthAdjust="spacingAndGlyphs">the missing lane visible to me. Public</tspan><tspan x="712.8" y="178.4" textLength="411.06" lengthAdjust="spacingAndGlyphs">is not the same as disclosed. I am not</tspan><tspan x="712.8" y="209.3" textLength="383.78" lengthAdjust="spacingAndGlyphs">the one who was owed an account,</tspan><tspan x="712.8" y="240.2" textLength="357.84" lengthAdjust="spacingAndGlyphs">and the question stands anyway.</tspan></text></g></svg>