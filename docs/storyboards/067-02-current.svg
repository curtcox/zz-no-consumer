<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="255.8" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="700" font-size="23.2" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="72.0" textLength="344.47" lengthAdjust="spacingAndGlyphs">UNDERLYING LATER-RUN</tspan><tspan x="712.8" y="103.7" textLength="391.74" lengthAdjust="spacingAndGlyphs">RECORDS — NOT REVIEWED</tspan><tspan x="712.8" y="135.3" textLength="207.30" lengthAdjust="spacingAndGlyphs">BY METR METR</tspan><tspan x="712.8" y="166.9" textLength="346.01" lengthAdjust="spacingAndGlyphs">CORROBORATION — NOT</tspan><tspan x="712.8" y="198.5" textLength="423.82" lengthAdjust="spacingAndGlyphs">AVAILABLE PRIMARY ACCOUNT</tspan><tspan x="712.8" y="230.2" textLength="423.79" lengthAdjust="spacingAndGlyphs">— OPENAI TECHNICAL REPORT</tspan></text></g><g><rect x="696.0" y="302.2" width="456.0" height="320.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text data-font-key="uncertainty" font-family="Verdana, 'DejaVu Sans', sans-serif" font-style="italic" font-weight="400" font-size="19.5" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="338.5" textLength="405.63" lengthAdjust="spacingAndGlyphs">ONE ACCOUNT. TO THE MINUTE.</tspan><tspan x="712.8" y="365.1" textLength="371.83" lengthAdjust="spacingAndGlyphs">THE INVESTIGATION WINDOW</tspan><tspan x="712.8" y="391.6" textLength="409.91" lengthAdjust="spacingAndGlyphs">NAMES A RANGE OF DATES. THE</tspan><tspan x="712.8" y="418.1" textLength="422.61" lengthAdjust="spacingAndGlyphs">REVIEW’S SCOPE ALSO DEPENDS</tspan><tspan x="712.8" y="444.6" textLength="322.50" lengthAdjust="spacingAndGlyphs">ON WHICH RECORDS THE</tspan><tspan x="712.8" y="471.1" textLength="381.75" lengthAdjust="spacingAndGlyphs">INVESTIGATORS WERE GIVEN.</tspan><tspan x="712.8" y="497.7" textLength="404.28" lengthAdjust="spacingAndGlyphs">AN EVENT CAN FALL INSIDE THE</tspan><tspan x="712.8" y="524.2" textLength="391.58" lengthAdjust="spacingAndGlyphs">DATES WHILE ITS UNDERLYING</tspan><tspan x="712.8" y="550.7" textLength="407.04" lengthAdjust="spacingAndGlyphs">BRANCH REMAINS OUTSIDE THE</tspan><tspan x="712.8" y="577.2" textLength="107.05" lengthAdjust="spacingAndGlyphs">REVIEW.</tspan></text></g></svg>