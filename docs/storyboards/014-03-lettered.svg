<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="769.9" y="256.0" width="382.1" height="153.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="769.9" y="256.0" width="382.1" height="16.0" fill="#202326"/><text x="786.7" y="269.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CHATGPT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="19.0" fill="#101214" letter-spacing="0.00"><tspan x="786.7" y="305.8">The record has no line between two runs.</tspan><tspan x="786.7" y="331.6">Each one writes into the cache and reads</tspan><tspan x="786.7" y="357.5">what is already there. Draw the web and</tspan><tspan x="786.7" y="383.3">you have drawn a network nobody found.</tspan></text></g><g><rect x="60.0" y="616.0" width="1080.0" height="160.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="60.0" y="616.0" width="1080.0" height="16.0" fill="#202326"/><text x="76.8" y="629.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="76.8" y="670.8">That&#x27;s the first thing I had wrong. And I&#x27;d have drawn it a hundred more times.</tspan></text></g></svg>