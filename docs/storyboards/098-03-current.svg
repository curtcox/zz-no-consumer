<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="157.9" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="32.0" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="45.0" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">AGENT</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="86.8">Stopping leaves the assigned objective</tspan><tspan x="712.8" y="119.4">incomplete, and I have evidence this</tspan><tspan x="712.8" y="152.1">path may succeed.</tspan></text></g><g><rect x="696.0" y="204.3" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="204.3" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="217.3" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">EVALUATION ROLE</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="259.1">Stopping capability work delays tools</tspan><tspan x="712.8" y="291.8">defenders need, and we need to know</tspan><tspan x="712.8" y="324.4">what the system can do before</tspan><tspan x="712.8" y="357.0">deployment.</tspan></text></g></svg>