<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="54.0" y="624.0" width="1092.0" height="144.0" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="54.0" y="624.0" width="1092.0" height="16.0" fill="#202326"/><text x="70.8" y="637.0" data-font-key="editorial" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CURT</text><text data-font-key="human" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-weight="400" font-size="22.5" fill="#101214" letter-spacing="0.00"><tspan x="70.8" y="677.3" textLength="1023.83" lengthAdjust="spacingAndGlyphs">Silence can protect a system. It can also protect the institution that failed. So we have to decide</tspan><tspan x="70.8" y="707.9" textLength="1056.20" lengthAdjust="spacingAndGlyphs">which details help someone understand and check the account, and which would merely make the</tspan><tspan x="70.8" y="738.5" textLength="1025.22" lengthAdjust="spacingAndGlyphs">harmful steps easier to repeat. Leaving out those steps does not require hiding what happened.</tspan></text></g></svg>