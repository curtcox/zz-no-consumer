<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="288.5" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="72.8">THE VALIDATORS. THE PAGE TOOL.</tspan><tspan x="712.8" y="105.4">THE CROSS REFERENCE. THE</tspan><tspan x="712.8" y="138.1">CHARACTER FILE THAT SAYS</tspan><tspan x="712.8" y="170.7">WHAT THIS PAGE MAY CLAIM. A</tspan><tspan x="712.8" y="203.4">SECOND MODEL WROTE THEM,</tspan><tspan x="712.8" y="236.0">UNDER A CONTRACT IT DID NOT</tspan><tspan x="712.8" y="268.6">WRITE.</tspan></text></g></svg>