<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><image href="data:image/svg+xml;base64," x="0" y="0" width="1200" height="800"/><g><rect x="696.0" y="32.0" width="456.0" height="157.9" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="72.8">BLACK HAT USA — 5 AUGUST 2026</tspan><tspan x="712.8" y="105.4">— OPENAI, ALIGNMENT AND</tspan><tspan x="712.8" y="138.1">SECURITY</tspan></text></g><g><rect x="696.0" y="204.3" width="456.0" height="190.6" fill="#E7E0D0" stroke="#202326" stroke-width="1.2"/><rect x="696.0" y="204.3" width="456.0" height="16.0" fill="#202326"/><text x="712.8" y="217.3" font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="9.0" fill="#E7E0D0" letter-spacing="0.4">CHAIR</text><text font-family="Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="24.0" fill="#101214" letter-spacing="0.00"><tspan x="712.8" y="259.1">The strongest case for continuing was</tspan><tspan x="712.8" y="291.8">made in public, three weeks after the</tspan><tspan x="712.8" y="324.4">incident. We will read it rather than</tspan><tspan x="712.8" y="357.0">imagine it.</tspan></text></g></svg>